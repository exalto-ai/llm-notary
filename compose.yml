services:
  api:
    image: ${API_IMAGE:-llm-notary-api:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      # Use Neon's pooled URL in shared deployments. It is intentionally
      # external so every API replica shares one durable source of truth.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the PostgreSQL connection URL}
      LLM_NOTARY_DATABASE_MAX_CONNECTIONS: ${LLM_NOTARY_DATABASE_MAX_CONNECTIONS:-5}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:?Set GITHUB_OAUTH_CLIENT_ID to the GitHub OAuth App client ID}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:?Set GITHUB_OAUTH_CLIENT_SECRET to the GitHub OAuth App client secret}
      LLM_NOTARY_API_LISTEN: 0.0.0.0:8080
      LLM_NOTARY_PUBLIC_ORIGIN: ${LLM_NOTARY_PUBLIC_ORIGIN:?Set LLM_NOTARY_PUBLIC_ORIGIN to the public site origin}
      LLM_NOTARY_NOTARY_HOST: ${LLM_NOTARY_NOTARY_HOST:?Set LLM_NOTARY_NOTARY_HOST to the public notary hostname or IP}
      LLM_NOTARY_NOTARY_PORT: ${NOTARY_PORT:-7047}
      LLM_NOTARY_NOTARY_TRANSPORT: ${LLM_NOTARY_NOTARY_TRANSPORT:-tcp}
      LLM_NOTARY_NOTARY_PUBLIC_KEY: ${LLM_NOTARY_NOTARY_PUBLIC_KEY:?Set LLM_NOTARY_NOTARY_PUBLIC_KEY to the notary SEC1 public key}
      LLM_NOTARY_NOTARY_DIRECTORY_JSON: ${LLM_NOTARY_NOTARY_DIRECTORY_JSON:-}
      LLM_NOTARY_NOTARY_DIRECTORY_GENERATION: ${LLM_NOTARY_NOTARY_DIRECTORY_GENERATION:-1}
      LLM_NOTARY_NOTARY_VALID_FROM_UNIX_MS: ${LLM_NOTARY_NOTARY_VALID_FROM_UNIX_MS:-0}
      LLM_NOTARY_S3_ACCESS_KEY_ID: ${LLM_NOTARY_S3_ACCESS_KEY_ID:?Set LLM_NOTARY_S3_ACCESS_KEY_ID to the bucket-scoped Spaces access key}
      LLM_NOTARY_S3_SECRET_ACCESS_KEY: ${LLM_NOTARY_S3_SECRET_ACCESS_KEY:?Set LLM_NOTARY_S3_SECRET_ACCESS_KEY to the bucket-scoped Spaces secret key}
      LLM_NOTARY_S3_BUCKET: ${LLM_NOTARY_S3_BUCKET:?Set LLM_NOTARY_S3_BUCKET to the private intake Space}
      LLM_NOTARY_S3_ENDPOINT: ${LLM_NOTARY_S3_ENDPOINT:?Set LLM_NOTARY_S3_ENDPOINT to the regional Spaces origin endpoint}
      LLM_NOTARY_S3_REGION: ${LLM_NOTARY_S3_REGION:?Set LLM_NOTARY_S3_REGION to the Space region}
      LLM_NOTARY_S3_PREFIX: ${LLM_NOTARY_S3_PREFIX:-llm-notary}
      LLM_NOTARY_S3_FORCE_PATH_STYLE: ${LLM_NOTARY_S3_FORCE_PATH_STYLE:-true}
      LLM_NOTARY_INTAKE_MAX_BYTES: ${LLM_NOTARY_INTAKE_MAX_BYTES:-134217728}
      LLM_NOTARY_INTAKE_UPLOAD_TTL_SECS: ${LLM_NOTARY_INTAKE_UPLOAD_TTL_SECS:-900}
      LLM_NOTARY_PLATFORM_SIGNING_KEY_FILE: /run/secrets/platform_signing_key
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_NOTARY_LIBRARY_METADATA_MODEL: ${LLM_NOTARY_LIBRARY_METADATA_MODEL:-gpt-5.6-luna}
      LLM_NOTARY_LIBRARY_METADATA_WEEKLY_BUDGET_CENTS: ${LLM_NOTARY_LIBRARY_METADATA_WEEKLY_BUDGET_CENTS:-1000}
      LLM_NOTARY_LIBRARY_METADATA_INPUT_NANOUSD_PER_TOKEN: ${LLM_NOTARY_LIBRARY_METADATA_INPUT_NANOUSD_PER_TOKEN:-200}
      LLM_NOTARY_LIBRARY_METADATA_CACHED_INPUT_NANOUSD_PER_TOKEN: ${LLM_NOTARY_LIBRARY_METADATA_CACHED_INPUT_NANOUSD_PER_TOKEN:-20}
      LLM_NOTARY_LIBRARY_METADATA_CACHE_WRITE_NANOUSD_PER_TOKEN: ${LLM_NOTARY_LIBRARY_METADATA_CACHE_WRITE_NANOUSD_PER_TOKEN:-250}
      LLM_NOTARY_LIBRARY_METADATA_OUTPUT_NANOUSD_PER_TOKEN: ${LLM_NOTARY_LIBRARY_METADATA_OUTPUT_NANOUSD_PER_TOKEN:-1200}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - source: platform_signing_key
        target: platform_signing_key
    restart: unless-stopped

  site:
    image: ${WEB_IMAGE:-llm-notary-web:local}
    build:
      context: ./js/app
      dockerfile: Dockerfile
      args:
        LLM_NOTARY_PUBLIC_ORIGIN: ${LLM_NOTARY_PUBLIC_ORIGIN:?Set LLM_NOTARY_PUBLIC_ORIGIN to the public site origin}
    restart: unless-stopped

  web:
    # Pinned so normal application deployments never replace the tunnel origin.
    image: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    depends_on:
      - api
      - site
    ports:
      - "127.0.0.1:${WEB_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/gateway.Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped

  notary:
    image: ${NOTARY_IMAGE:-llm-notary-notary:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: notary
    environment:
      NOTARY_SIGNING_KEY_FILE: /run/secrets/notary_signing_key
      LLM_NOTARY_NOTARY_PUBLIC_KEY: ${LLM_NOTARY_NOTARY_PUBLIC_KEY:?Set LLM_NOTARY_NOTARY_PUBLIC_KEY to the notary SEC1 public key}
      # Internal-only scrape endpoint. Do not publish it through the gateway.
      LLM_NOTARY_METRICS_LISTEN: 0.0.0.0:9090
    ports:
      - "${NOTARY_PORT:-7047}:7047"
    mem_limit: 1g
    secrets:
      - source: notary_signing_key
        target: notary_signing_key
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test \"$(certified-notary --signing-key /run/secrets/notary_signing_key --print-public-key)\" = \"$${LLM_NOTARY_NOTARY_PUBLIC_KEY}\""]
      interval: 30s
      timeout: 5s
      retries: 3

  tunnel:
    image: cloudflare/cloudflared:2026.7.3
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN to the named Cloudflare Tunnel token}
    depends_on:
      - web
    restart: unless-stopped

secrets:
  notary_signing_key:
    file: ${NOTARY_SIGNING_KEY_FILE:?Set NOTARY_SIGNING_KEY_FILE to the host signing-key path}
  platform_signing_key:
    file: ${PLATFORM_SIGNING_KEY_FILE:?Set PLATFORM_SIGNING_KEY_FILE to the host platform signing-key path}
