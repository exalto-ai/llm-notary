services:
  api:
    image: ${API_IMAGE:-llm-notary-api:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      DATABASE_URL: sqlite:///var/lib/llm-notary/api.db
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:?Set GITHUB_OAUTH_CLIENT_ID to the GitHub OAuth App client ID}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:?Set GITHUB_OAUTH_CLIENT_SECRET to the GitHub OAuth App client secret}
      LLM_NOTARY_API_LISTEN: 0.0.0.0:8080
      LLM_NOTARY_PUBLIC_ORIGIN: https://${SITE_DOMAIN:?Set SITE_DOMAIN to the public site hostname}
      LLM_NOTARY_NOTARY_HOST: ${LLM_NOTARY_NOTARY_HOST:?Set LLM_NOTARY_NOTARY_HOST to the public notary hostname or IP}
      LLM_NOTARY_NOTARY_PORT: ${NOTARY_PORT:-7047}
    volumes:
      - api_data:/var/lib/llm-notary
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-llm-notary-web:local}
    build:
      context: ./js/app
      dockerfile: Dockerfile
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  notary:
    image: ${NOTARY_IMAGE:-llm-notary-notary:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: notary
    environment:
      NOTARY_SIGNING_KEY_FILE: /run/secrets/notary_signing_key
    ports:
      - "${NOTARY_PORT:-7047}:7047"
    secrets:
      - source: notary_signing_key
        target: notary_signing_key
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:2026.7.3
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN to the named Cloudflare Tunnel token}
    depends_on:
      - api
      - web
    restart: unless-stopped

secrets:
  notary_signing_key:
    file: ${NOTARY_SIGNING_KEY_FILE:?Set NOTARY_SIGNING_KEY_FILE to the host signing-key path}

volumes:
  api_data:
  caddy_data:
  caddy_config:
