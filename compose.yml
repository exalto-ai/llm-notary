services:
  migrate:
    # The API image includes the SQLx migrator. Run it to completion before
    # starting or replacing API replicas so a fresh deployment cannot serve
    # database-backed routes against an unmigrated schema.
    image: ${NOTARY_API_IMAGE:-notary-api:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: notary-api
    command: ["notary-api", "migrate"]
    environment:
      NOTARY_API_MIGRATION_DATABASE_URL: ${NOTARY_API_MIGRATION_DATABASE_URL:?Set NOTARY_API_MIGRATION_DATABASE_URL to the direct PostgreSQL connection URL used only for migrations}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  notary-api:
    image: ${NOTARY_API_IMAGE:-notary-api:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: notary-api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      # Use Neon's pooled URL in shared deployments. It is intentionally
      # external so every API replica shares one durable source of truth.
      NOTARY_API_DATABASE_URL: ${NOTARY_API_DATABASE_URL:?Set NOTARY_API_DATABASE_URL to the PostgreSQL connection URL}
      NOTARY_API_DATABASE_MAX_CONNECTIONS: ${NOTARY_API_DATABASE_MAX_CONNECTIONS:-5}
      # This reference deployment configures both providers so either account
      # type remains usable during the canonical configuration cutover.
      NOTARY_API_GOOGLE_CLIENT_ID: ${NOTARY_API_GOOGLE_CLIENT_ID:?Set NOTARY_API_GOOGLE_CLIENT_ID}
      NOTARY_API_GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_oauth_client_secret
      NOTARY_API_GITHUB_CLIENT_ID: ${NOTARY_API_GITHUB_CLIENT_ID:?Set NOTARY_API_GITHUB_CLIENT_ID}
      NOTARY_API_GITHUB_CLIENT_SECRET_FILE: /run/secrets/github_oauth_client_secret
      NOTARY_API_LISTEN: 0.0.0.0:8080
      NOTARY_PUBLIC_ORIGIN: ${NOTARY_PUBLIC_ORIGIN:?Set NOTARY_PUBLIC_ORIGIN to the public site origin}
      NOTARY_API_REGISTRY_FILE: /run/secrets/notary_registry
      NOTARY_API_S3_ACCESS_KEY_ID: ${NOTARY_API_S3_ACCESS_KEY_ID:?Set NOTARY_API_S3_ACCESS_KEY_ID to the bucket-scoped access key}
      NOTARY_API_S3_SECRET_ACCESS_KEY: ${NOTARY_API_S3_SECRET_ACCESS_KEY:?Set NOTARY_API_S3_SECRET_ACCESS_KEY to the bucket-scoped secret key}
      NOTARY_API_S3_BUCKET: ${NOTARY_API_S3_BUCKET:?Set NOTARY_API_S3_BUCKET to the private Trace bucket}
      NOTARY_API_S3_ENDPOINT: ${NOTARY_API_S3_ENDPOINT:?Set NOTARY_API_S3_ENDPOINT to the regional S3 endpoint}
      NOTARY_API_S3_REGION: ${NOTARY_API_S3_REGION:?Set NOTARY_API_S3_REGION}
      NOTARY_API_S3_PREFIX: ${NOTARY_API_S3_PREFIX:-notary-api}
      NOTARY_API_S3_FORCE_PATH_STYLE: ${NOTARY_API_S3_FORCE_PATH_STYLE:-true}
      NOTARY_API_STORAGE_MAX_PACKAGE_BYTES: ${NOTARY_API_STORAGE_MAX_PACKAGE_BYTES:-134299648}
      NOTARY_API_STORAGE_UPLOAD_TTL_SECS: ${NOTARY_API_STORAGE_UPLOAD_TTL_SECS:-900}
      NOTARY_API_ADMISSION_SERVICE_TOKEN_FILE: /run/secrets/admission_service_token
      NOTARY_API_ADMISSION_ANONYMOUS_SUBJECT_HMAC_KEY_FILE: /run/secrets/anonymous_subject_hmac_key
      NOTARY_API_ADMISSION_ANONYMOUS_SUBJECT_HMAC_KEY_VERSION: ${NOTARY_API_ADMISSION_ANONYMOUS_SUBJECT_HMAC_KEY_VERSION:-1}
      # The API is internal to this Compose network; only the stable Caddy
      # gateway may supply x-notary-client-ip.
      NOTARY_API_ADMISSION_TRUSTED_PROXY_CIDRS: ${NOTARY_API_ADMISSION_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - source: admission_service_token
        target: admission_service_token
        mode: 0400
      - source: anonymous_subject_hmac_key
        target: anonymous_subject_hmac_key
        mode: 0400
      - source: notary_registry
        target: notary_registry
        mode: 0400
      - source: google_oauth_client_secret
        target: google_oauth_client_secret
        mode: 0400
      - source: github_oauth_client_secret
        target: github_oauth_client_secret
        mode: 0400
    networks:
      default:
        aliases:
          - notary-api.internal
    restart: unless-stopped

  site:
    image: ${WEB_IMAGE:-llm-notary-web:local}
    build:
      context: ./js/app
      dockerfile: Dockerfile
      args:
        LLM_NOTARY_PUBLIC_ORIGIN: ${NOTARY_PUBLIC_ORIGIN:?Set NOTARY_PUBLIC_ORIGIN to the public site origin}
    restart: unless-stopped

  web:
    # Pinned so normal application deployments never replace the tunnel origin.
    image: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    depends_on:
      - notary-api
      - site
    ports:
      - "127.0.0.1:${WEB_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/gateway.Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped

  notary:
    image: ${NOTARY_IMAGE:-notary-server:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: notary
    environment:
      NOTARY_SERVER_LISTEN: 0.0.0.0:7047
      NOTARY_SERVER_SIGNING_KEY_FILE: /run/secrets/notary_signing_key
      NOTARY_SERVER_ALLOW_HOSTS: api.openai.com,chatgpt.com,api.anthropic.com,api.deepseek.com,openrouter.ai
      NOTARY_SERVER_PUBLIC_KEY: ${NOTARY_SERVER_PUBLIC_KEY:?Set NOTARY_SERVER_PUBLIC_KEY to the notary SEC1 public key}
      NOTARY_SERVER_PLATFORM_API_ORIGIN: http://notary-api.internal:8080
      NOTARY_SERVER_PLATFORM_SERVICE_TOKEN_FILE: /run/secrets/admission_service_token
      NOTARY_SERVER_REGISTRY_GENERATION: ${NOTARY_SERVER_REGISTRY_GENERATION:-1}
      NOTARY_SERVER_INSTANCE_ID: ${NOTARY_SERVER_INSTANCE_ID:-notary-compose-1}
      NOTARY_SERVER_USAGE_OUTBOX_DIR: /var/lib/notary-server/usage-outbox
      NOTARY_SERVER_SHUTDOWN_GRACE_SECS: ${NOTARY_SERVER_SHUTDOWN_GRACE_SECS:-15}
      # Internal-only scrape endpoint. Do not publish it through the gateway.
      NOTARY_SERVER_METRICS_LISTEN: 0.0.0.0:9090
    ports:
      - "${NOTARY_PORT:-7047}:7047"
    mem_limit: 1g
    secrets:
      - source: notary_signing_key
        target: notary_signing_key
        mode: 0400
      - source: admission_service_token
        target: admission_service_token
        mode: 0400
    read_only: true
    volumes:
      - notary_data:/var/lib/notary-server
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "test \"$(notary-server public-key --signing-key-file /run/secrets/notary_signing_key)\" = \"$${NOTARY_SERVER_PUBLIC_KEY}\""]
      interval: 30s
      timeout: 5s
      retries: 3

  tunnel:
    image: cloudflare/cloudflared:2026.7.3
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN to the named Cloudflare Tunnel token}
    depends_on:
      - web
    restart: unless-stopped

secrets:
  notary_signing_key:
    file: ${NOTARY_SERVER_SIGNING_KEY_FILE:?Set NOTARY_SERVER_SIGNING_KEY_FILE to the host signing-key path}
  admission_service_token:
    file: ${NOTARY_API_ADMISSION_SERVICE_TOKEN_FILE:?Set NOTARY_API_ADMISSION_SERVICE_TOKEN_FILE to the shared notary-api/notary-server admission service-token path}
  anonymous_subject_hmac_key:
    file: ${NOTARY_API_ADMISSION_ANONYMOUS_SUBJECT_HMAC_KEY_FILE:?Set NOTARY_API_ADMISSION_ANONYMOUS_SUBJECT_HMAC_KEY_FILE to the notary-api anonymous-subject HMAC key path}
  notary_registry:
    file: ${NOTARY_API_REGISTRY_FILE:?Set NOTARY_API_REGISTRY_FILE to the canonical Registry JSON path}
  google_oauth_client_secret:
    file: ${NOTARY_API_GOOGLE_CLIENT_SECRET_FILE:?Set NOTARY_API_GOOGLE_CLIENT_SECRET_FILE}
  github_oauth_client_secret:
    file: ${NOTARY_API_GITHUB_CLIENT_SECRET_FILE:?Set NOTARY_API_GITHUB_CLIENT_SECRET_FILE}

volumes:
  notary_data:
