services:
  setup:
    image: ${DAEMON_E2E_IMAGE:-llm-notary-daemon-e2e:local}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        mkdir -p /state/secrets /state/bundles /state/traces
        mkdir -p /fixtures
        if ! test -f /state/secrets/vault-passphrase; then
          printf '%s' 'deterministic-daemon-e2e-passphrase' > /state/secrets/vault-passphrase
        fi
        if ! test -f /fixtures/ca.der; then
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /fixtures/ca.key
          openssl req -x509 -new -key /fixtures/ca.key -sha256 -days 2 \
            -subj /CN=LLM-Notary-Daemon-E2E-Root \
            -addext basicConstraints=critical,CA:TRUE \
            -addext keyUsage=critical,keyCertSign,cRLSign \
            -out /fixtures/ca.pem
          openssl x509 -in /fixtures/ca.pem -outform DER -out /fixtures/ca.der
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /fixtures/server.key
          openssl req -new -key /fixtures/server.key \
            -subj /CN=api.openai.com -out /fixtures/server.csr
          printf '%s\n' \
            'basicConstraints=critical,CA:FALSE' \
            'keyUsage=critical,digitalSignature,keyEncipherment' \
            'extendedKeyUsage=serverAuth' \
            'subjectAltName=DNS:api.openai.com' > /fixtures/server.ext
          openssl x509 -req -in /fixtures/server.csr \
            -CA /fixtures/ca.pem -CAkey /fixtures/ca.key -CAcreateserial \
            -sha256 -days 2 -extfile /fixtures/server.ext -out /fixtures/server.pem
        fi
        printf '%064d' 1 > /fixtures/notary-signing-key
        chmod 600 /state/secrets/vault-passphrase
        chmod 600 /fixtures/ca.key /fixtures/server.key /fixtures/notary-signing-key
    volumes:
      - daemon-state:/state
      - fixture-state:/fixtures
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  provider:
    image: ${DAEMON_E2E_IMAGE:-llm-notary-daemon-e2e:local}
    depends_on:
      setup:
        condition: service_completed_successfully
    entrypoint: ["python3", "/usr/local/libexec/llm-notary-e2e-provider.py"]
    volumes:
      - fixture-state:/fixtures:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: "no"
    networks:
      default:
        aliases:
          - api.openai.com
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "--fail", "--silent", "--show-error", "--resolve", "api.openai.com:443:127.0.0.1", "--cacert", "/fixtures/ca.pem", "https://api.openai.com/healthz"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s

  notary:
    image: ${DAEMON_E2E_IMAGE:-llm-notary-daemon-e2e:local}
    depends_on:
      setup:
        condition: service_completed_successfully
      provider:
        condition: service_healthy
    entrypoint: ["llm-notary-e2e-notary"]
    environment:
      LLM_NOTARY_DAEMON_E2E_ROOT_CA_DER: /fixtures/ca.der
      LLM_NOTARY_DAEMON_E2E_SIGNING_KEY_FILE: /fixtures/notary-signing-key
    volumes:
      - fixture-state:/fixtures:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 7047), 1).close()"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 1s

  daemon:
    image: ${DAEMON_E2E_IMAGE:-llm-notary-daemon-e2e:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: daemon-e2e
    depends_on:
      setup:
        condition: service_completed_successfully
      provider:
        condition: service_healthy
      notary:
        condition: service_healthy
    command: ["--config", "/etc/llm-notary/config.toml"]
    environment:
      LLM_NOTARY_VAULT_PASSPHRASE_FILE: /state/secrets/vault-passphrase
      LLM_NOTARY_DAEMON_E2E_ROOT_CA_DER: /fixtures/ca.der
      LLM_NOTARY_DAEMON_E2E_PAUSE_AFTER_FINALIZED_ARTIFACT_MS: ${DAEMON_E2E_FINALIZATION_PAUSE_MS:-0}
      XDG_CONFIG_HOME: /state/xdg-config
      XDG_DATA_HOME: /state/xdg-data
    volumes:
      - daemon-state:/state
      - fixture-state:/fixtures:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8788/healthz"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s

volumes:
  daemon-state:
  fixture-state:

networks:
  default:
    internal: true
