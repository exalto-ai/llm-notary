[package]
name = "certified"
version = "0.1.0"
edition = "2024"
autobins = false
license = "MIT OR Apache-2.0"
description = "Local, privacy-preserving TLS-notarized LLM traces"

[[bin]]
name = "certified-notary"
path = "src/bin/certified-notary.rs"

[[bin]]
name = "llm-notary"
path = "src/bin/llm-notary.rs"

[[bin]]
name = "llm-notary-api"
path = "src/bin/llm-notary-api.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
bincode = "1.3"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
http = "1.3"
http-body = "1.0"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
k256 = { version = "0.13", features = ["ecdsa"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "runtime-tokio-rustls", "sqlite"] }
time = "0.3"
tokio = { version = "1.45", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.16", features = ["v4"] }

# TLSNotary is vendored at a pinned upstream revision with a small relay-drain
# fix required for multi-frame agent requests in Proxy-TLS mode.
tlsn = { path = "vendor/tlsn/crates/tlsn", features = ["mozilla-certs"] }
tlsn-formats = { path = "vendor/tlsn/crates/formats" }

[dev-dependencies]
dhat = "0.3"
rangeset = "0.4"
tiktoken-rs = "0.12"
tls-server-fixture = { path = "vendor/tlsn/crates/tls-server-fixture" }
tlsn = { path = "vendor/tlsn/crates/tlsn", features = ["mozilla-certs", "test-utils"] }
