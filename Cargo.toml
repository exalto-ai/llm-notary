[package]
name = "certified"
version = "0.1.0"
edition = "2024"
autobins = false
license = "MIT OR Apache-2.0"
description = "Local, privacy-preserving TLS-notarized LLM traces"

[[bin]]
name = "certified-notary"
path = "src/bin/certified-notary.rs"

[[bin]]
name = "llm-notary"
path = "src/bin/llm-notary.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros"] }
bincode = "1.3"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
hex = "0.4"
http = "1.3"
http-body = "1.0"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
k256 = { version = "0.13", features = ["ecdsa"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.45", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# TLSNotary is vendored at a pinned upstream revision with a small relay-drain
# fix required for multi-frame agent requests in Proxy-TLS mode.
tlsn = { path = "vendor/tlsn/crates/tlsn", features = ["mozilla-certs"] }
tlsn-formats = { path = "vendor/tlsn/crates/formats" }
