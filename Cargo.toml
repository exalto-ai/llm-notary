[package]
name = "llm-notary"
version = "0.1.0"
edition = "2024"
autobins = false
license = "MIT OR Apache-2.0"
description = "Local, privacy-preserving TLS-notarized LLM traces"

[workspace]
members = [
    "crates/llm-notary-client",
    "crates/llm-notary-core",
    "crates/llm-notary-platform",
    "crates/llm-notary-server",
]
exclude = ["vendor/tlsn"]
resolver = "2"

[[bin]]
name = "llm-notary-server"
path = "src/bin/llm-notary-server.rs"

[[bin]]
name = "llm-notary"
path = "src/bin/llm-notary.rs"
required-features = ["cli"]

[[bin]]
name = "llm-notary-api"
path = "src/bin/llm-notary-api.rs"
required-features = ["api"]

[[bin]]
name = "llm-notary-api-migrate"
path = "src/bin/llm-notary-api-migrate.rs"
required-features = ["api"]

[features]
default = ["cli"]
api = ["dep:llm-notary-platform"]
cli = [
    "dep:llm-notary-client",
]

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
bincode = "1.3"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
http = "1.3"
http-body = "1.0"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
k256 = { version = "0.13", features = ["ecdsa"] }
llm-notary-client = { path = "crates/llm-notary-client", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = "0.23"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "runtime-tokio-rustls", "postgres"] }
time = "0.3"
tokio = { version = "1.45", features = ["full"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["compat"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
uuid = { version = "1.16", features = ["v4"] }
webpki-roots = "1"
zip = { version = "8.4", default-features = false }
llm-notary-core = { path = "crates/llm-notary-core" }
llm-notary-platform = { path = "crates/llm-notary-platform", optional = true }
llm-notary-server = { path = "crates/llm-notary-server" }

# TLSNotary is vendored at a pinned upstream revision. Local patches add the
# multi-frame Proxy-TLS relay drain fix and the authenticated root-binding
# checkpoint primitives used by stateless deferred finalization.
tlsn = { path = "vendor/tlsn/crates/tlsn", features = ["mozilla-certs"] }
tlsn-formats = { path = "vendor/tlsn/crates/formats" }
metrics = { version = "0.24.6", default-features = false }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
opentelemetry = "0.32.0"
opentelemetry-http = "0.32.0"
opentelemetry_sdk = "0.32.1"
tracing-opentelemetry = "0.33.0"
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
dhat = "0.3"
llm-notary-core = { path = "crates/llm-notary-core", features = ["test-utils"] }
rangeset = "0.4"
testcontainers-modules = { version = "0.15", default-features = false, features = ["postgres"] }
tiktoken-rs = "0.12"
tls-server-fixture = { path = "vendor/tlsn/crates/tls-server-fixture" }
tlsn = { path = "vendor/tlsn/crates/tlsn", features = ["mozilla-certs", "test-utils"] }
