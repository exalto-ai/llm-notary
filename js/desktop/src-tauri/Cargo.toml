[package]
name = "llm-notary-desktop"
version = "0.1.0"
description = "Guided desktop shell for the LLM Notary local service"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
name = "llm_notary_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
llm-notary-core = { path = "../../../crates/llm-notary-core", features = ["cli"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["time"] }
