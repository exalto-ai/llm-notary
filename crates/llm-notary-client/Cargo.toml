[package]
name = "llm-notary-client"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Local LLM Notary daemon and REST-backed command client"
build = "build.rs"

[[bin]]
name = "llm-notary"
path = "src/bin/llm-notary.rs"

[[bin]]
name = "llm-notaryd"
path = "src/bin/llm-notaryd.rs"

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
http = "1.3"
http-body-util = "0.1"
hex = "0.4"
fs2 = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
llm-notary-core = { path = "../llm-notary-core", features = ["cli", "openapi"] }
libc = "0.2"
mime_guess = "2.0"
minisign-verify = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7.4"
rusqlite = { version = "0.32", features = ["bundled"] }
rust-embed = "8.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
tokio = { version = "1.45", features = ["full"] }
tokio-stream = "0.1"
toml = "0.8"
tracing = "0.1"
tower-http = { version = "0.7", features = ["limit", "request-id", "sensitive-headers", "trace"] }
url = "2.5"
utoipa = { version = "5.5", features = ["axum_extras", "uuid"] }
uuid = { version = "1.16", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
llm-notary-core = { path = "../llm-notary-core", features = ["test-utils"] }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }
