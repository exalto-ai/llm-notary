[package]
name = "llm-notary-evidence"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Stable evidence and public-artifact contracts for LLM Notary"

[dependencies]
anyhow = "1.0"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
zip = { version = "8.4", default-features = false }

[dev-dependencies]
uuid = { version = "1.16", features = ["v4"] }
