[package]
name = "notary-server-platform-adapter"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Private platform admission and settlement adapter for Notary server"

[[bin]]
name = "notary-server"
path = "src/bin/notary-server.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
hex = "0.4"
notary-core = { path = "../../../runtime/crates/notary-core" }
notary-server = { path = "../../../runtime/crates/notary-server" }
metrics = { version = "0.24.6", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45", features = ["full"] }
tracing = "0.1"
url = "2.5"

[dev-dependencies]
axum = "0.8"
tempfile = "3.20"
