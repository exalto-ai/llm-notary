# Repository-scoped, ephemeral Linux runners for the ordinary CI checks.
# Authentication is supplied separately as the `llmnotary-github-auth` secret.
githubConfigUrl: "https://github.com/exalto-ai/llmnotary"
githubConfigSecret: llmnotary-github-auth

controllerServiceAccount:
  name: arc-gha-rs-controller
  namespace: arc-system

runnerScaleSetName: llmnotary-ci
minRunners: 0
maxRunners: 2

template:
  spec:
    # Prefer the worker, but use the otherwise-idle high-memory control-plane
    # node when the worker's requested memory is already reserved.
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: hexchess/node-class
                  operator: In
                  values:
                    - cpu-worker
    terminationGracePeriodSeconds: 30
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: "4"
            memory: 8Gi
            ephemeral-storage: 30Gi
          limits:
            cpu: "12"
            memory: 20Gi
            ephemeral-storage: 80Gi
