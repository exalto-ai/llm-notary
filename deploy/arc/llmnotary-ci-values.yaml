# Repository-scoped, ephemeral Linux runners for the ordinary CI checks.
# Authentication is supplied separately as the `llmnotary-github-auth` secret.
githubConfigUrl: "https://github.com/exalto-ai/llmnotary"
githubConfigSecret: llmnotary-github-auth

runnerScaleSetName: llmnotary-ci
minRunners: 0
maxRunners: 1

template:
  spec:
    # Do not consume the GPU node for normal Rust and SPA builds.
    nodeSelector:
      hexchess/node-class: cpu-worker
    terminationGracePeriodSeconds: 30
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: "4"
            memory: 8Gi
            ephemeral-storage: 30Gi
          limits:
            cpu: "12"
            memory: 20Gi
            ephemeral-storage: 80Gi
