app = "llm-notary-prod-notary"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "../../Dockerfile"
  build-target = "notary"

[env]
  LLM_NOTARY_METRICS_LISTEN = "0.0.0.0:9090"
  LLM_NOTARY_ADMISSION_API_ORIGIN = "http://llm-notary-prod-api.flycast"
  LLM_NOTARY_ADMISSION_SERVICE_TOKEN_FILE = "/run/secrets/admission_service_token"
  # Temporary drain audit for #298. The stop-legacy notary never writes here.
  LLM_NOTARY_RELEASE_OUTBOX_DIR = "/data/release-outbox"
  LLM_NOTARY_NOTARY_DIRECTORY_GENERATION = "4"
  LLM_NOTARY_USAGE_OUTBOX_DIR = "/data/usage-outbox"

[processes]
# This emits operational resource measurements only; it never logs transcripts,
# headers, credentials, or bundle paths.
app = "--profile-sessions"

[[mounts]]
  source = "notary_data"
  destination = "/data"

[metrics]
  # This listener is internal-only; the public TLS service is exposed on 443.
  port = 9090
  path = "/metrics"

[[services]]
  processes = ["app"]
  internal_port = 7047
  protocol = "tcp"
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [services.concurrency]
    type = "connections"
    # Leave enough connections for the protocol to report its own typed
    # capacity rejection instead of having Fly reject the TCP socket first.
    soft_limit = 12
    hard_limit = 128

  [[services.ports]]
    # Terminate public TLS only; the binary notary protocol remains raw bytes
    # inside Fly's encrypted backhaul.
    port = 443
    handlers = ["tls"]
    tls_options = { versions = ["TLSv1.2", "TLSv1.3"] }

[[files]]
  guest_path = "/run/secrets/notary_signing_key"
  secret_name = "NOTARY_SIGNING_KEY_B64"

[[files]]
  guest_path = "/run/secrets/admission_service_token"
  secret_name = "ADMISSION_SERVICE_TOKEN_B64"

[[vm]]
  # Fly requires at least 2 GB for a performance VM.
  memory = "2gb"
  # Deferred proof finalization is CPU-bound. A performance vCPU avoids the
  # quota throttling inherent in Fly's shared CPU class.
  cpu_kind = "performance"
  cpus = 1
