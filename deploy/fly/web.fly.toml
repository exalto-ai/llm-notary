app = "llm-notary-prod-web"
primary_region = "sjc"

[build]
  dockerfile = "web.Dockerfile"

  [build.args]
    LLM_NOTARY_PUBLIC_ORIGIN = "https://llm-notary.exalto.ai"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 25
    hard_limit = 50

[[statics]]
  guest_path = "/"
  url_prefix = "/downloads"
  tigris_bucket = "llm-notary-prod-downloads"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
