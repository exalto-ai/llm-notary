app = "llm-notary-prod-web"
primary_region = "sjc"

[build]
  dockerfile = "web.Dockerfile"

  [build.args]
    NOTARY_PUBLIC_ORIGIN = "https://notary.exalto.ai"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false

  [http_service.concurrency]
    type = "connections"
    soft_limit = 25
    hard_limit = 50

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
