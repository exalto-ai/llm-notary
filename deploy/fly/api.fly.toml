app = "llm-notary-prod-api"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "../../Dockerfile"
  build-target = "api"

[deploy]
  # Run the SQLx baseline / future migrations once before replacing API
  # Machines. A failure leaves the existing release serving traffic.
  release_command = "llm-notary-api-migrate"
  release_command_timeout = "5m"

[env]
  LLM_NOTARY_API_LISTEN = "0.0.0.0:8080"
  LLM_NOTARY_PUBLIC_ORIGIN = "https://llm-notary.exalto.ai"
  LLM_NOTARY_NOTARY_HOST = "llm-notary-prod-notary.fly.dev"
  LLM_NOTARY_NOTARY_PORT = "443"
  LLM_NOTARY_NOTARY_TRANSPORT = "tls"
  # This revision adds Fly edge TLS to the advertised endpoint. Clients cache
  # directories by generation, so endpoint changes must increase it.
  LLM_NOTARY_NOTARY_DIRECTORY_GENERATION = "3"
  # Keep the existing namespace when moving published state from Spaces.
  LLM_NOTARY_S3_PREFIX = "llm-notary"
  LLM_NOTARY_S3_FORCE_PATH_STYLE = "true"
  # Kept for rollback compatibility until the contract migration removes it.
  LLM_NOTARY_PLATFORM_SIGNING_KEY_FILE = "/run/secrets/platform_signing_key"
  LLM_NOTARY_ADMISSION_SERVICE_TOKEN_FILE = "/run/secrets/admission_service_token"
  # Keep the per-Machine pool small. With both replicas active this is ten
  # database connections; use Neon's pooled connection URL.
  LLM_NOTARY_DATABASE_MAX_CONNECTIONS = "5"
  # Each API Machine exits after this much activity-free time once durable
  # admission and cleanup work is clear. Fly starts a stopped Machine on the
  # next Flycast request.
  LLM_NOTARY_IDLE_SHUTDOWN_SECS = "45"

[metrics]
  # Fly scrapes this private route every 15 seconds; it is not exposed through
  # the public web gateway.
  port = 8080
  path = "/metrics"

[http_service]
  internal_port = 8080
  force_https = false
  # The API's database-coordinated workers keep each Machine alive until its
  # durable work is clear, then the process exits after its idle grace period.
  # Fly autostart wakes a stopped Machine for the next Flycast request.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 50

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/api/readyz"
    timeout = "5s"

[[files]]
  guest_path = "/run/secrets/platform_signing_key"
  secret_name = "PLATFORM_SIGNING_KEY_B64"

[[files]]
  guest_path = "/run/secrets/admission_service_token"
  secret_name = "ADMISSION_SERVICE_TOKEN_B64"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
