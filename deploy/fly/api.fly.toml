app = "llm-notary-prod-api"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "../../Dockerfile"
  build-target = "api"

[deploy]
  # Run the SQLx baseline / future migrations once before replacing API
  # Machines. A failure leaves the existing release serving traffic.
  release_command = "llm-notary-api-migrate"
  release_command_timeout = "5m"

[env]
  LLM_NOTARY_API_LISTEN = "0.0.0.0:8080"
  LLM_NOTARY_PUBLIC_ORIGIN = "https://notary.exalto.ai"
  LLM_NOTARY_NOTARY_HOST = "alice.notary.exalto.ai"
  LLM_NOTARY_NOTARY_PORT = "443"
  LLM_NOTARY_NOTARY_TRANSPORT = "tls"
  # This revision moves the advertised endpoint to its custom hostname. Clients
  # cache directories by generation, so endpoint changes must increase it.
  LLM_NOTARY_NOTARY_DIRECTORY_GENERATION = "4"
  # Keep the existing namespace when moving published state from Spaces.
  LLM_NOTARY_S3_PREFIX = "llm-notary"
  LLM_NOTARY_S3_FORCE_PATH_STYLE = "true"
  LLM_NOTARY_ADMISSION_SERVICE_TOKEN_FILE = "/run/secrets/admission_service_token"
  LLM_NOTARY_ANONYMOUS_SUBJECT_HMAC_KEY_FILE = "/run/secrets/anonymous_subject_hmac_key"
  LLM_NOTARY_ANONYMOUS_SUBJECT_HMAC_KEY_VERSION = "1"
  # Requests arrive only from the separate web app over Fly's private network.
  LLM_NOTARY_TRUSTED_PROXY_CIDRS = "fdaa::/16"
  # Keep the per-Machine pool small. With both replicas active this is ten
  # database connections; use Neon's pooled connection URL.
  LLM_NOTARY_DATABASE_MAX_CONNECTIONS = "5"

[metrics]
  # Fly scrapes this private route every 15 seconds; it is not exposed through
  # the public web gateway.
  port = 8080
  path = "/metrics"

[http_service]
  internal_port = 8080
  force_https = false
  # Both provisioned API Machines remain running so requests and background
  # workers do not incur cold starts.
  auto_stop_machines = "off"
  auto_start_machines = false

  [http_service.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 50

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/api/readyz"
    timeout = "5s"

[[files]]
  guest_path = "/run/secrets/admission_service_token"
  secret_name = "ADMISSION_SERVICE_TOKEN_B64"

[[files]]
  guest_path = "/run/secrets/anonymous_subject_hmac_key"
  secret_name = "ANONYMOUS_SUBJECT_HMAC_KEY_B64"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
