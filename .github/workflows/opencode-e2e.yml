name: OpenCode E2E canary

on:
  workflow_dispatch:
    inputs:
      model:
        description: Reviewed OpenCode model ID; must be an exact OpenRouter :free model
        required: false
        default: openrouter/cohere/north-mini-code:free
        type: string
  schedule:
    - cron: "17 16 * * 1"

permissions:
  contents: read

concurrency:
  group: opencode-e2e-production
  cancel-in-progress: false

jobs:
  canary:
    name: Production canary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: opencode-e2e
    env:
      CANARY_MODEL: ${{ inputs.model || 'openrouter/cohere/north-mini-code:free' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install Node 24.14.1
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1

      - name: Install OpenCode 1.18.11
        run: npm install --global opencode-ai@1.18.11

      - name: Build released Notary binaries
        run: cargo build --manifest-path runtime/Cargo.toml --target-dir target --release --locked -p notaryctl --bin notaryctl -p notaryd --bin notaryd

      - name: Test canary parser and safety gates
        run: python3 runtime/benchmarks/opencode-e2e/test_runner.py -v

      - name: Run production canary
        env:
          OPENROUTER_FREE_TIER_API_KEY: ${{ secrets.OPENROUTER_FREE_TIER_API_KEY }}
          NOTARYD_E2E_API_KEY: ${{ secrets.LLM_NOTARY_E2E_API_KEY }}
        run: |
          python3 runtime/benchmarks/opencode-e2e/run.py \
            --model "$CANARY_MODEL" \
            --opencode "$(command -v opencode)" \
            --notaryctl "$GITHUB_WORKSPACE/target/release/notaryctl" \
            --notaryd "$GITHUB_WORKSPACE/target/release/notaryd" \
            --result "$RUNNER_TEMP/opencode-e2e-result.json"

      - name: Post sanitized Slack summary
        if: always()
        env:
          NOTARYD_E2E_SLACK_WEBHOOK_URL: ${{ secrets.LLM_NOTARY_SLACK_WEBHOOK_URL }}
        run: python3 runtime/benchmarks/opencode-e2e/notify.py "$RUNNER_TEMP/opencode-e2e-result.json"

      - name: Upload sanitized metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opencode-e2e-result
          path: ${{ runner.temp }}/opencode-e2e-result.json
          if-no-files-found: warn
          retention-days: 14
