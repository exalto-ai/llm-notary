name: Desktop DMG

# Full DMG builds are intentionally manual or release-only. Pull requests use
# the faster macOS desktop bundle job in ci.yml so a change never buys two Mac
# runners for overlapping validation.
on:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign and notarize the DMGs
        type: boolean
        default: true
  workflow_call:
    inputs:
      sign:
        description: Sign and notarize the DMGs
        type: boolean
        default: true
      build_id:
        description: Immutable client build identifier embedded in the app and sidecar
        required: false
        type: string
      public_origin:
        description: Public application origin embedded in the app and sidecar
        required: false
        type: string
      updates_enabled:
        description: Allow this signed build to follow the production update channel
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: desktop-dmg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: macos-arm64
    runs-on: macos-14
    environment: ${{ inputs.sign && 'macos-release' || 'desktop-preview' }}
    env:
      ASSET: macos-arm64
      TARGET: aarch64-apple-darwin
      NOTARY_BUILD_ID: ${{ inputs.build_id || format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) }}
      NOTARY_PUBLIC_ORIGIN: ${{ inputs.public_origin || vars.LLM_NOTARY_PUBLIC_ORIGIN || 'https://notary.exalto.ai' }}
      NOTARY_UPDATES_ENABLED: ${{ inputs.updates_enabled && '1' || '0' }}
    defaults:
      run:
        working-directory: apps/notary-app
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/notary-app/package-lock.json
      - run: npm ci

      - name: Prepare bundled daemon
        run: npm run prepare:sidecar:release
      - name: Build unsigned preview DMG
        if: ${{ inputs.sign == false }}
        run: npm exec -- tauri build --target "$TARGET" --bundles app,dmg --no-sign --ci

      - name: Import Developer ID certificate
        if: inputs.sign
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Prepare App Store Connect API key
        if: inputs.sign
        env:
          NOTARIZATION_KEY_BASE64: ${{ secrets.APPLE_NOTARIZATION_KEY_BASE64 }}
          NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${NOTARIZATION_KEY_ID}.p8"
          printf '%s' "$NOTARIZATION_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Build signed and notarized DMG
        if: inputs.sign
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm exec -- tauri build --target "$TARGET" --bundles app,dmg --config src-tauri/tauri.release.conf.json --ci

      # Tauri notarizes and staples the application before creating the disk
      # image. The finished DMG is a separate Apple-distributed container and
      # needs its own notarization ticket for Gatekeeper to accept the download.
      - name: Notarize and staple signed DMG
        if: inputs.sign
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
        run: |
          set -euo pipefail
          dmg=$(find "../../target/$TARGET/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"

      - name: Verify package
        run: |
          set -euo pipefail
          dmg=$(find "../../target/$TARGET/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          hdiutil verify "$dmg"
          mkdir -p release
          cp "$dmg" "release/Notary-${ASSET}.dmg"
          (cd release && shasum -a 256 "Notary-${ASSET}.dmg" > "Notary-${ASSET}.dmg.sha256")
          if ${{ inputs.sign }}; then
            updater=$(find "../../target/$TARGET/release/bundle/macos" -maxdepth 1 -name '*.app.tar.gz' -print -quit)
            test -n "$updater"
            test -s "$updater.sig"
            cp "$updater" "release/Notary-${ASSET}.app.tar.gz"
            cp "$updater.sig" "release/Notary-${ASSET}.app.tar.gz.sig"
            (cd release && shasum -a 256 "Notary-${ASSET}.app.tar.gz" > "Notary-${ASSET}.app.tar.gz.sha256")
          fi
      - name: Resolve signed artifacts
        id: artifacts
        if: inputs.sign
        run: |
          set -euo pipefail
          # Absolute paths: later steps match the launched process against its
          # executable path, and a relative path never matches.
          bundle="$(cd "../../target/$TARGET/release/bundle" && pwd)"
          app="$(find "$bundle/macos" -maxdepth 1 -name '*.app' -print -quit)"
          dmg="$(find "$bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$app"
          test -n "$dmg"
          {
            echo "app=$app"
            echo "dmg=$dmg"
          } >> "$GITHUB_OUTPUT"
      - name: Verify Developer ID and notarization
        if: inputs.sign
        env:
          APP: ${{ steps.artifacts.outputs.app }}
          DMG: ${{ steps.artifacts.outputs.dmg }}
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$DMG"
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"
          spctl --assess --type execute --verbose=4 "$APP"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"
          # The installed application identity is fixed: Notary.app backed by
          # notary-app, identified as ai.exalto.notary, with exactly the
          # notary-app executable and its notaryd sidecar and no retired
          # executable left in the bundle.
          test "$(basename "$APP")" = "Notary.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            "$APP/Contents/Info.plist")" = "ai.exalto.notary"
          test "$(cd "$APP/Contents/MacOS" && ls | sort | tr '\n' ' ')" = "notary-app notaryd "
          test -x "$APP/Contents/MacOS/notary-app"
          test -x "$APP/Contents/MacOS/notaryd"
          test "$(lipo -archs "$APP/Contents/MacOS/notary-app")" = arm64
          test "$(lipo -archs "$APP/Contents/MacOS/notaryd")" = arm64
          strings "$APP/Contents/MacOS/notary-app" | grep -F "$NOTARY_BUILD_ID" >/dev/null
          "$APP/Contents/MacOS/notaryd" --version | grep -F "$NOTARY_BUILD_ID" >/dev/null
      - name: Launch the application from the signed DMG
        if: inputs.sign
        env:
          DMG: ${{ steps.artifacts.outputs.dmg }}
        run: |
          set -euo pipefail
          # Launch what a user actually installs — the bundle inside the DMG,
          # not the build-tree copy — so a corrupt or incomplete DMG fails here
          # rather than on a user's machine.
          mount_point="$(mktemp -d)"
          trap 'hdiutil detach "$mount_point" -force >/dev/null 2>&1 || true' EXIT
          hdiutil attach "$DMG" -mountpoint "$mount_point" -nobrowse -readonly -quiet
          app="$mount_point/Notary.app"
          test -d "$app"
          executable="$app/Contents/MacOS/notary-app"
          open "$app"
          started=false
          for _ in $(seq 1 30); do
            if pgrep -f "$executable" >/dev/null; then
              started=true
              break
            fi
            sleep 1
          done
          if test "$started" != true; then
            echo "the packaged application never started" >&2
            exit 1
          fi
          # Starting is not enough: a bundle that dies during Tauri or daemon
          # initialization must not ship, so require it to still be running.
          sleep 15
          if ! pgrep -f "$executable" >/dev/null; then
            echo "the packaged application exited during startup" >&2
            exit 1
          fi
          osascript -e 'quit app "Notary"' >/dev/null 2>&1 || true
          pkill -f "$executable" >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-arm64
          path: apps/notary-app/release/*
          if-no-files-found: error
          retention-days: 3
