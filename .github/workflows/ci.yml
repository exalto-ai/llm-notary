name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE*"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE*"

permissions:
  contents: read

# Only the newest revision of a PR needs feedback; obsolete runs consume runners
# and delay the result for the commit a reviewer will actually merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: llmnotary-ci
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends build-essential
      - run: cargo test --all-targets --all-features

  app:
    name: SPA
    runs-on: llmnotary-ci
    defaults:
      run:
        working-directory: js/app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/app/package-lock.json
      - run: npm ci
      - run: npm run build

  containers:
    name: Container configuration
    runs-on: llmnotary-docker
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/setup-compose-action@v1
      - name: Validate Compose configuration
        run: |
          openssl rand -hex 32 > "$RUNNER_TEMP/notary-signing-key"
          NOTARY_SIGNING_KEY_FILE="$RUNNER_TEMP/notary-signing-key" \
            LLM_NOTARY_NOTARY_PUBLIC_KEY=0279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798 \
            CLOUDFLARE_TUNNEL_TOKEN=ci-placeholder \
            GITHUB_OAUTH_CLIENT_ID=ci-placeholder \
            GITHUB_OAUTH_CLIENT_SECRET=ci-placeholder \
            LLM_NOTARY_NOTARY_HOST=203.0.113.10 \
            LLM_NOTARY_S3_ACCESS_KEY_ID=ci-placeholder \
            LLM_NOTARY_S3_SECRET_ACCESS_KEY=ci-placeholder \
            LLM_NOTARY_S3_BUCKET=llm-notary-ci \
            LLM_NOTARY_S3_ENDPOINT=https://sfo3.digitaloceanspaces.com \
            LLM_NOTARY_S3_REGION=sfo3 \
            SITE_DOMAIN=example.com \
            docker compose config --quiet
      - name: Build notary image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: notary
          load: false
          push: false
          cache-from: type=gha,scope=rust-service-images
          cache-to: type=gha,mode=max,scope=rust-service-images
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: js/app
          load: false
          push: false
          cache-from: type=gha,scope=web-image
          cache-to: type=gha,mode=max,scope=web-image
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          load: false
          push: false
          cache-from: type=gha,scope=rust-service-images
          cache-to: type=gha,mode=max,scope=rust-service-images
