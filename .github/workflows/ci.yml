name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo test --all-targets

  app:
    name: SPA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js/app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/app/package-lock.json
      - run: npm ci
      - run: npm run build

  containers:
    name: Container configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        run: |
          openssl rand -hex 32 > "$RUNNER_TEMP/notary-signing-key"
          NOTARY_SIGNING_KEY_FILE="$RUNNER_TEMP/notary-signing-key" \
            SITE_DOMAIN=example.com \
            docker compose config --quiet
      - name: Build notary image
        run: docker build --tag llm-notary-notary:ci .
      - name: Build web image
        run: docker build --tag llm-notary-web:ci js/app
