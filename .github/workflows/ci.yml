name: CI

on:
  pull_request:
    paths-ignore:
      - "LICENSE*"
  push:
    branches:
      - main
    paths-ignore:
      - "LICENSE*"

permissions:
  contents: read
  pull-requests: read

# Only the newest revision of a PR needs feedback; obsolete runs consume runners
# and delay the result for the commit a reviewer will actually merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A newer PR revision makes an older run obsolete. A main run may already be
  # inside the production deployment, however, and must be allowed to finish
  # so that it cannot be cancelled halfway through a multi-service rollout.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      app: ${{ steps.filter.outputs.app }}
      desktop: ${{ steps.filter.outputs.desktop }}
      docs: ${{ steps.filter.outputs.docs }}
      containers: ${{ steps.filter.outputs.containers }}
      cli: ${{ steps.filter.outputs.cli }}
      windows_update: ${{ steps.filter.outputs.windows_update }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - '.github/workflows/ci.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'migrations-postgres/**'
              - 'compose.daemon-e2e.yml'
              - 'compose.daemon-server.yml'
              - 'deploy/daemon-server/**'
              - 'deploy/daemon-e2e/**'
              - 'rust-toolchain.toml'
              - 'scripts/test-daemon-persistence-e2e.sh'
              - 'scripts/test-daemon-server-e2e.sh'
              - 'scripts/llm-notary-server.sh'
              - 'crates/**'
              - 'src/**'
              - 'tests/**'
              - 'skills/**'
              - 'vendor/tlsn/**'
              - 'vendor/tlsn-utils/**'
            app:
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/llm-notary-client/Cargo.toml'
              - 'crates/llm-notary-client/src/admin.rs'
              - 'crates/llm-notary-client/examples/export-local-openapi.rs'
              - 'crates/llm-notary-platform/Cargo.toml'
              - 'crates/llm-notary-platform/src/**'
              - 'crates/llm-notary-platform/examples/export-hosted-openapi.rs'
              - 'config/updater-public-key.txt'
              - 'js/app/**'
              - 'js/desktop/src-tauri/tauri.release.conf.json'
              - 'scripts/release-manifest.mjs'
              - 'scripts/release-manifest.test.mjs'
            desktop:
              # Website-only changes are validated by the Linux SPA job. The
              # packaged dashboard output enters through the Rust client tree.
              - '.github/workflows/ci.yml'
              - '.github/workflows/desktop-dmg.yml'
              - '.github/workflows/release.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/llm-notary-client/**'
              - 'crates/llm-notary-core/**'
              - 'config/updater-public-key.txt'
              - 'js/desktop/**'
            docs:
              - '.github/workflows/ci.yml'
              - 'AGENTS.md'
              - 'CONTRIBUTING.md'
              - 'DESIGN.md'
              - 'README.md'
              - 'deploy/**/*.md'
              - 'docs/**'
              - 'skills/**'
              - 'js/app/public/llms.txt'
              - 'js/app/scripts/check-local-docs.mjs'
              - 'js/app/src/main.jsx'
              - 'js/app/src/local-dashboard/generated/openapi.json'
            containers:
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy.yml'
              - '.github/workflows/release.yml'
              - '.dockerignore'
              - 'Dockerfile'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'migrations-postgres/**'
              - 'crates/**'
              - 'src/**'
              - 'tests/**'
              - 'vendor/tlsn/**'
              - 'vendor/tlsn-utils/**'
              - 'compose.yml'
              - 'compose.daemon-e2e.yml'
              - 'compose.daemon-server.yml'
              - 'deploy/**'
              - 'js/app/**'
              - 'scripts/test-daemon-persistence-e2e.sh'
              - 'scripts/llm-notary-server.sh'
            cli:
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/desktop-dmg.yml'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'LICENSE*'
              - 'THIRD-PARTY-NOTICES.md'
              - 'crates/llm-notary-client/**'
              - 'crates/llm-notary-core/**'
              - 'skills/**'
              - 'vendor/tlsn/**'
              - 'vendor/tlsn-utils/**'
              - 'js/app/public/install.sh'
              - 'js/app/scripts/test-install.sh'
              - 'js/desktop/**'
              - 'config/updater-public-key.txt'
              - 'scripts/release-manifest.mjs'
              - 'scripts/release-manifest.test.mjs'
            windows_update:
              - '.github/workflows/ci.yml'
              - 'Cargo.lock'
              - 'crates/llm-notary-client/Cargo.toml'
              - 'crates/llm-notary-client/src/artifact_*.rs'
              - 'crates/llm-notary-client/src/local_cli.rs'
              - 'crates/llm-notary-client/src/s3_artifact_store.rs'
              - 'crates/llm-notary-client/src/update.rs'

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends build-essential
      - run: cargo clippy -p llm-notary-core -p llm-notary-client -p llm-notary-server -p llm-notary-platform --all-targets --all-features -- -D warnings
      - run: cargo test -p llm-notary-core -p llm-notary-client -p llm-notary-server -p llm-notary-platform --all-targets --all-features

  postgres-integration:
    name: PostgreSQL integration
    needs: [changes, rust]
    if: ${{ always() && needs.changes.outputs.rust == 'true' && needs.rust.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Confirm Docker is available
        run: docker info
      - name: Run PostgreSQL-backed API tests
        run: |
          cargo test -p llm-notary-platform new_cli_session_is_usable_until_its_refresh_expiry -- --ignored
          cargo test -p llm-notary-platform provider_neutral_identity_migration_backfills_and_dual_writes -- --ignored
          cargo test -p llm-notary-platform provider_identity_cutover_uses_new_authority_and_preserves_rollback_compatibility -- --ignored
          cargo test -p llm-notary-platform provider_identity_cleanup_reconciles_and_preserves_account_ownership -- --ignored
          cargo test -p llm-notary-platform web_users_can_list_and_revoke_only_their_cli_sessions -- --ignored
          cargo test -p llm-notary-platform cli_session_pagination_is_stable_when_last_used_changes -- --ignored
          cargo test -p llm-notary-platform deleting_an_account_cascades_database_rows_and_queues_every_artifact -- --ignored
          cargo test -p llm-notary-platform keys_are_one_time_scoped_revocable_expiring_and_account_isolated -- --ignored
          cargo test -p llm-notary-platform listed_share_route_pages_ties_nulls_filters_and_concurrent_inserts -- --ignored
          cargo test -p llm-notary-platform service_admission::tests -- --ignored
      - name: Run PostgreSQL-backed daemon metadata tests
        run: cargo test -p llm-notary-client postgres_metadata_store::tests -- --ignored --nocapture
      - name: Run S3-compatible daemon artifact tests
        run: cargo test -p llm-notary-client s3_artifact_store::tests::minio_conforms_and_detects_missing_corrupt_and_oversized_objects -- --ignored --nocapture
      - name: Run daemon persistence and server matrix
        run: |
          scripts/test-daemon-persistence-e2e.sh sqlite filesystem 1 full
          DAEMON_E2E_SKIP_BUILD=1 DAEMON_E2E_POSTGRES_SCENARIOS=extended scripts/test-daemon-persistence-e2e.sh postgres filesystem 1 full
          DAEMON_E2E_SKIP_BUILD=1 scripts/test-daemon-persistence-e2e.sh sqlite s3 1 full
          DAEMON_E2E_SKIP_BUILD=1 scripts/test-daemon-persistence-e2e.sh postgres s3 1 full
          DAEMON_E2E_SKIP_BUILD=1 scripts/test-daemon-persistence-e2e.sh postgres s3 2 full

  windows-update:
    name: Windows client update
    needs: changes
    if: needs.changes.outputs.windows_update == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: client-update-windows
      - name: Test Windows-specific client workflows
        run: |
          cargo test --locked -p llm-notary-client update::tests --lib
          cargo test --locked -p llm-notary-client local_cli::tests::skill_install --lib
          cargo test --locked -p llm-notary-client artifact_store::tests --lib
          cargo test --locked -p llm-notary-client artifact_router::tests --lib
          cargo test --locked -p llm-notary-client s3_artifact_store::tests --lib

  app:
    name: SPA
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: js/app
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/app/package-lock.json
      - run: npm ci
      - run: node ../../scripts/release-manifest.test.mjs
      - run: npm run build
      - name: Verify generated APIs and embedded dashboard are committed
        run: git -C ../.. diff --exit-code -- js/app/src/local-dashboard/generated js/app/src/platform-api/generated crates/llm-notary-client/dashboard
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - run: npm run test:dashboard
      - run: npm run test:site
      - run: npm run test:install

  desktop:
    name: macOS desktop bundle
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.desktop == 'true' }}
    runs-on: macos-14
    defaults:
      run:
        working-directory: js/desktop
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/desktop/package-lock.json
      - run: npm ci
      - name: Prepare bundled daemon
        run: npm run prepare:sidecar:debug
      - run: cargo clippy -p llm-notary-desktop --all-targets -- -D warnings
      - name: Build debug application bundle with bundled daemon
        run: npm exec -- tauri build --debug --bundles app
      - name: Verify signed updater artifact packaging
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/updater.key"
          npm exec -- tauri signer generate --ci --password test-password --write-keys "$key" >/dev/null
          LLM_NOTARY_BUILD_ID=ci-updater-fixture \
            TAURI_SIGNING_PRIVATE_KEY="$key" \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD=test-password \
            npm exec -- tauri build --debug --bundles app \
              --config src-tauri/tauri.release.conf.json --ci
          updater=$(find ../../target/debug/bundle/macos -maxdepth 1 -name '*.app.tar.gz' -print -quit)
          test -n "$updater"
          test -s "$updater.sig"

  docs:
    name: Local workflow documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node js/app/scripts/check-local-docs.mjs

  containers:
    name: Deployment configuration
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-compose-action@v1
      - name: Validate production container workspace planning
        run: docker build --target planner .
      - name: Test Fly image digest resolution
        run: bash deploy/fly/test-resolve-image-digest.sh
      - name: Test Fly active Machine restart
        run: bash deploy/fly/test-restart-active-machines.sh
      - name: Validate Compose configuration
        run: |
          openssl rand -hex 32 > "$RUNNER_TEMP/notary-signing-key"
          openssl rand -hex 32 > "$RUNNER_TEMP/admission-service-token"
          openssl rand -hex 32 > "$RUNNER_TEMP/anonymous-subject-hmac-key"
          NOTARY_SIGNING_KEY_FILE="$RUNNER_TEMP/notary-signing-key" \
            ADMISSION_SERVICE_TOKEN_FILE="$RUNNER_TEMP/admission-service-token" \
            ANONYMOUS_SUBJECT_HMAC_KEY_FILE="$RUNNER_TEMP/anonymous-subject-hmac-key" \
            LLM_NOTARY_NOTARY_PUBLIC_KEY=0279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798 \
            CLOUDFLARE_TUNNEL_TOKEN=ci-placeholder \
            GITHUB_OAUTH_CLIENT_ID=ci-placeholder \
            GITHUB_OAUTH_CLIENT_SECRET=ci-placeholder \
            GOOGLE_OAUTH_CLIENT_ID=ci-placeholder \
            GOOGLE_OAUTH_CLIENT_SECRET=ci-placeholder \
            DATABASE_URL=postgresql://ci-placeholder:ci-placeholder@db.example.com/llm_notary?sslmode=require \
            DATABASE_MIGRATIONS_URL=postgresql://ci-placeholder:ci-placeholder@db.example.com/llm_notary?sslmode=require \
            LLM_NOTARY_NOTARY_HOST=203.0.113.10 \
            LLM_NOTARY_S3_ACCESS_KEY_ID=ci-placeholder \
            LLM_NOTARY_S3_SECRET_ACCESS_KEY=ci-placeholder \
            LLM_NOTARY_S3_BUCKET=llm-notary-ci \
            LLM_NOTARY_S3_ENDPOINT=https://sfo3.digitaloceanspaces.com \
            LLM_NOTARY_S3_REGION=sfo3 \
            LLM_NOTARY_PUBLIC_ORIGIN=https://example.com \
            docker compose config --quiet
      - name: Validate simplified daemon server bundle
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/llm-notary-server"
          LLM_NOTARY_SERVER_STATE_DIR="$state" \
            LLM_NOTARY_BOOTSTRAP_API_KEY=llmn_v1_11111111111111111111111111111111_2222222222222222222222222222222222222222222222222222222222222222 \
            scripts/llm-notary-server.sh init proxy.example.com admin.example.com >/dev/null
          rendered=$(docker compose --env-file "$state/.env" -f compose.daemon-server.yml config --format json)
          jq -e '
            .services.daemon.deploy.mode == "replicated" and
            .services.daemon.deploy.replicas == 2 and
            (.services.daemon.expose | sort) == ["8787", "8788"] and
            (.services | has("daemon-a") | not) and
            (.services | has("daemon-b") | not) and
            (.services | has("ingress") | not)
          ' <<<"$rendered" >/dev/null
          test "$(wc -c < "$state/secrets/server-vault.key")" -eq 32
          test ! -e "$state/secrets/vault-passphrase"
          if LLM_NOTARY_SERVER_STATE_DIR="$state" \
            LLM_NOTARY_BOOTSTRAP_API_KEY=llmn_v1_11111111111111111111111111111111_2222222222222222222222222222222222222222222222222222222222222222 \
            scripts/llm-notary-server.sh init proxy.example.com admin.example.com >/dev/null 2>&1; then
            echo "server initializer overwrote existing state" >&2
            exit 1
          fi

  required:
    name: Required checks
    if: always()
    needs: [changes, rust, postgres-integration, windows-update, app, desktop, docs, containers]
    runs-on: ubuntu-24.04
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      RUST_CHANGED: ${{ needs.changes.outputs.rust }}
      RUST_RESULT: ${{ needs.rust.result }}
      POSTGRES_RESULT: ${{ needs.postgres-integration.result }}
      WINDOWS_UPDATE_CHANGED: ${{ needs.changes.outputs.windows_update }}
      WINDOWS_UPDATE_RESULT: ${{ needs.windows-update.result }}
      APP_CHANGED: ${{ needs.changes.outputs.app }}
      APP_RESULT: ${{ needs.app.result }}
      DESKTOP_REQUIRED: ${{ github.event_name == 'pull_request' && needs.changes.outputs.desktop == 'true' }}
      DESKTOP_RESULT: ${{ needs.desktop.result }}
      DOCS_CHANGED: ${{ needs.changes.outputs.docs }}
      DOCS_RESULT: ${{ needs.docs.result }}
      CONTAINERS_CHANGED: ${{ needs.changes.outputs.containers }}
      CONTAINERS_RESULT: ${{ needs.containers.result }}
    steps:
      - name: Require every selected check to pass
        run: |
          set -euo pipefail

          if test "$CHANGES_RESULT" != success; then
            echo "changed-path selection ended with: $CHANGES_RESULT" >&2
            exit 1
          fi

          require_selected() {
            local name="$1"
            local selected="$2"
            local result="$3"
            if test "$selected" = true && test "$result" != success; then
              echo "$name was selected but ended with: $result" >&2
              exit 1
            fi
            case "$result" in
              success|skipped) ;;
              *) echo "$name ended with: $result" >&2; exit 1 ;;
            esac
          }

          require_selected Rust "$RUST_CHANGED" "$RUST_RESULT"
          require_selected PostgreSQL "$RUST_CHANGED" "$POSTGRES_RESULT"
          require_selected "Windows client update" "$WINDOWS_UPDATE_CHANGED" "$WINDOWS_UPDATE_RESULT"
          require_selected SPA "$APP_CHANGED" "$APP_RESULT"
          require_selected Desktop "$DESKTOP_REQUIRED" "$DESKTOP_RESULT"
          require_selected Documentation "$DOCS_CHANGED" "$DOCS_RESULT"
          require_selected Deployment "$CONTAINERS_CHANGED" "$CONTAINERS_RESULT"

  deploy:
    name: Production deployment
    needs: [changes, required]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.containers == 'true' &&
      needs.required.result == 'success'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  publish-cli:
    name: Publish website CLI
    needs: [changes, required, deploy]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.cli == 'true' &&
      needs.required.result == 'success' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    uses: ./.github/workflows/release.yml
    with:
      channel: latest
    secrets: inherit
