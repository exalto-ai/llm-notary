name: CI

on:
  pull_request:
    paths-ignore:
      - "LICENSE*"
  push:
    branches:
      - main
    paths-ignore:
      - "LICENSE*"

permissions:
  contents: read
  pull-requests: read

# Only the newest revision of a PR needs feedback; obsolete runs consume runners
# and delay the result for the commit a reviewer will actually merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A newer PR revision makes an older run obsolete. A main run may already be
  # inside the production deployment, however, and must be allowed to finish
  # so that it cannot be cancelled halfway through a multi-service rollout.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      app: ${{ steps.filter.outputs.app }}
      docs: ${{ steps.filter.outputs.docs }}
      containers: ${{ steps.filter.outputs.containers }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - '.github/workflows/ci.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'migrations-postgres/**'
              - 'rust-toolchain.toml'
              - 'crates/**'
              - 'src/**'
              - 'tests/**'
              - 'vendor/tlsn/**'
              - 'vendor/tlsn-utils/**'
            app:
              - '.github/workflows/ci.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/llm-notary-client/Cargo.toml'
              - 'crates/llm-notary-client/src/admin.rs'
              - 'crates/llm-notary-client/examples/export-local-openapi.rs'
              - 'crates/llm-notary-platform/Cargo.toml'
              - 'crates/llm-notary-platform/src/**'
              - 'crates/llm-notary-platform/examples/export-hosted-openapi.rs'
              - 'js/app/**'
            docs:
              - '.github/workflows/ci.yml'
              - 'AGENTS.md'
              - 'CONTRIBUTING.md'
              - 'DESIGN.md'
              - 'README.md'
              - 'deploy/**/*.md'
              - 'docs/**'
              - 'js/app/public/llms.txt'
              - 'js/app/scripts/check-local-docs.mjs'
              - 'js/app/src/main.jsx'
              - 'js/app/src/local-dashboard/generated/openapi.json'
            containers:
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy.yml'
              - '.dockerignore'
              - 'Dockerfile'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'migrations-postgres/**'
              - 'crates/**'
              - 'src/**'
              - 'tests/**'
              - 'vendor/tlsn/**'
              - 'vendor/tlsn-utils/**'
              - 'compose.yml'
              - 'deploy/**'
              - 'js/app/**'

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends build-essential
      - run: cargo clippy -p llm-notary-core -p llm-notary-client -p llm-notary-server -p llm-notary-platform --all-targets --all-features -- -D warnings
      - run: cargo test -p llm-notary-core -p llm-notary-client -p llm-notary-server -p llm-notary-platform --all-targets --all-features

  postgres-integration:
    name: PostgreSQL integration
    needs: [changes, rust]
    if: ${{ always() && needs.changes.outputs.rust == 'true' && needs.rust.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Confirm Docker is available
        run: docker info
      - name: Run PostgreSQL-backed API tests
        run: |
          cargo test -p llm-notary-platform new_cli_session_is_usable_until_its_refresh_expiry -- --ignored
          cargo test -p llm-notary-platform web_users_can_list_and_revoke_only_their_cli_sessions -- --ignored
          cargo test -p llm-notary-platform cli_session_pagination_is_stable_when_last_used_changes -- --ignored
          cargo test -p llm-notary-platform keys_are_one_time_scoped_revocable_expiring_and_account_isolated -- --ignored
          cargo test -p llm-notary-platform listed_share_route_pages_ties_nulls_filters_and_concurrent_inserts -- --ignored
          cargo test -p llm-notary-platform service_admission::tests -- --ignored

  app:
    name: SPA
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: js/app
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/app/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify generated APIs and embedded dashboard are committed
        run: git -C ../.. diff --exit-code -- js/app/src/local-dashboard/generated js/app/src/platform-api/generated crates/llm-notary-client/dashboard
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - run: npm run test:dashboard
      - run: npm run test:site

  docs:
    name: Local workflow documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node js/app/scripts/check-local-docs.mjs

  containers:
    name: Deployment configuration
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-compose-action@v1
      - name: Test Fly image digest resolution
        run: bash deploy/fly/test-resolve-image-digest.sh
      - name: Test Fly active Machine restart
        run: bash deploy/fly/test-restart-active-machines.sh
      - name: Validate Compose configuration
        run: |
          openssl rand -hex 32 > "$RUNNER_TEMP/notary-signing-key"
          openssl rand -hex 32 > "$RUNNER_TEMP/admission-service-token"
          openssl rand -hex 32 > "$RUNNER_TEMP/anonymous-subject-hmac-key"
          NOTARY_SIGNING_KEY_FILE="$RUNNER_TEMP/notary-signing-key" \
            ADMISSION_SERVICE_TOKEN_FILE="$RUNNER_TEMP/admission-service-token" \
            ANONYMOUS_SUBJECT_HMAC_KEY_FILE="$RUNNER_TEMP/anonymous-subject-hmac-key" \
            LLM_NOTARY_NOTARY_PUBLIC_KEY=0279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798 \
            CLOUDFLARE_TUNNEL_TOKEN=ci-placeholder \
            GITHUB_OAUTH_CLIENT_ID=ci-placeholder \
            GITHUB_OAUTH_CLIENT_SECRET=ci-placeholder \
            DATABASE_URL=postgresql://ci-placeholder:ci-placeholder@db.example.com/llm_notary?sslmode=require \
            DATABASE_MIGRATIONS_URL=postgresql://ci-placeholder:ci-placeholder@db.example.com/llm_notary?sslmode=require \
            LLM_NOTARY_NOTARY_HOST=203.0.113.10 \
            LLM_NOTARY_S3_ACCESS_KEY_ID=ci-placeholder \
            LLM_NOTARY_S3_SECRET_ACCESS_KEY=ci-placeholder \
            LLM_NOTARY_S3_BUCKET=llm-notary-ci \
            LLM_NOTARY_S3_ENDPOINT=https://sfo3.digitaloceanspaces.com \
            LLM_NOTARY_S3_REGION=sfo3 \
            LLM_NOTARY_PUBLIC_ORIGIN=https://example.com \
            docker compose config --quiet

  required:
    name: Required checks
    if: always()
    needs: [changes, rust, postgres-integration, app, docs, containers]
    runs-on: ubuntu-24.04
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      RUST_CHANGED: ${{ needs.changes.outputs.rust }}
      RUST_RESULT: ${{ needs.rust.result }}
      POSTGRES_RESULT: ${{ needs.postgres-integration.result }}
      APP_CHANGED: ${{ needs.changes.outputs.app }}
      APP_RESULT: ${{ needs.app.result }}
      DOCS_CHANGED: ${{ needs.changes.outputs.docs }}
      DOCS_RESULT: ${{ needs.docs.result }}
      CONTAINERS_CHANGED: ${{ needs.changes.outputs.containers }}
      CONTAINERS_RESULT: ${{ needs.containers.result }}
    steps:
      - name: Require every selected check to pass
        run: |
          set -euo pipefail

          if test "$CHANGES_RESULT" != success; then
            echo "changed-path selection ended with: $CHANGES_RESULT" >&2
            exit 1
          fi

          require_selected() {
            local name="$1"
            local selected="$2"
            local result="$3"
            if test "$selected" = true && test "$result" != success; then
              echo "$name was selected but ended with: $result" >&2
              exit 1
            fi
            case "$result" in
              success|skipped) ;;
              *) echo "$name ended with: $result" >&2; exit 1 ;;
            esac
          }

          require_selected Rust "$RUST_CHANGED" "$RUST_RESULT"
          require_selected PostgreSQL "$RUST_CHANGED" "$POSTGRES_RESULT"
          require_selected SPA "$APP_CHANGED" "$APP_RESULT"
          require_selected Documentation "$DOCS_CHANGED" "$DOCS_RESULT"
          require_selected Deployment "$CONTAINERS_CHANGED" "$CONTAINERS_RESULT"

  deploy:
    name: Production deployment
    needs: [changes, required]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.containers == 'true' &&
      needs.required.result == 'success'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
