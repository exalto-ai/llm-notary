name: CI

on:
  pull_request:
    paths-ignore:
      - "LICENSE*"
  push:
    branches:
      - main
    paths-ignore:
      - "LICENSE*"

permissions:
  contents: read
  pull-requests: read

# Only the newest revision of a PR needs feedback; obsolete runs consume runners
# and delay the result for the commit a reviewer will actually merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A newer PR revision makes an older run obsolete. A main run may already be
  # inside the production deployment, however, and must be allowed to finish
  # so that it cannot be cancelled halfway through a multi-service rollout.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      app: ${{ steps.filter.outputs.app }}
      desktop: ${{ steps.filter.outputs.desktop }}
      docs: ${{ steps.filter.outputs.docs }}
      containers: ${{ steps.filter.outputs.containers }}
      cli: ${{ steps.filter.outputs.cli }}
      windows_update: ${{ steps.filter.outputs.windows_update }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - '.github/workflows/ci.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'platform/**'
              - 'runtime/**'
            app:
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'platform/crates/notary-api/**'
              - 'runtime/apps/admin-dashboard/**'
              - 'runtime/crates/notaryd/**'
              - 'platform/web/**'
              - 'apps/notary-app/src-tauri/tauri.release.conf.json'
              - 'scripts/release-manifest.mjs'
              - 'scripts/release-manifest.test.mjs'
            desktop:
              - '.github/workflows/ci.yml'
              - '.github/workflows/desktop-dmg.yml'
              - '.github/workflows/release.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'runtime/crates/notaryd/**'
              - 'runtime/crates/notary-core/**'
              - 'runtime/crates/notary-updater/**'
              - 'runtime/config/updater-public-key.txt'
              - 'apps/notary-app/**'
            docs:
              - '.github/workflows/ci.yml'
              - 'runtime/README.md'
              - 'runtime/AGENTS.md'
              - 'runtime/docs/**'
              - 'runtime/skills/**'
              - 'runtime/apps/admin-dashboard/scripts/check-local-docs.mjs'
              - 'runtime/apps/admin-dashboard/src/generated/openapi.json'
            containers:
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy.yml'
              - '.github/workflows/release.yml'
              - '.dockerignore'
              - 'Dockerfile'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'platform/**'
              - 'runtime/**'
              - 'compose.yml'
              - 'deploy/**'
              - 'platform/web/**'
            cli:
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/desktop-dmg.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'runtime/LICENSE*'
              - 'runtime/THIRD-PARTY-NOTICES.md'
              - 'runtime/crates/notaryd/**'
              - 'runtime/crates/notary-core/**'
              - 'runtime/crates/notaryctl/**'
              - 'runtime/crates/notary-updater/**'
              - 'runtime/skills/**'
              - 'platform/web/public/install.sh'
              - 'platform/web/scripts/test-install.sh'
              - 'apps/notary-app/**'
              - 'runtime/config/updater-public-key.txt'
              - 'scripts/release-manifest.mjs'
              - 'scripts/release-manifest.test.mjs'
            windows_update:
              - '.github/workflows/ci.yml'
              - 'Cargo.lock'
              - 'runtime/Cargo.lock'
              - 'runtime/crates/notaryd/**'
              - 'runtime/crates/notaryctl/**'
              - 'runtime/crates/notary-updater/**'

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo fmt --manifest-path runtime/Cargo.toml --check -p notary-core -p notaryd -p notaryctl -p notary-updater -p notary-server
      - run: runtime/tooling/check-boundary.sh
      - run: python3 -m unittest runtime/tooling/test_check_boundary.py
      - name: Install native build tools
        run: |
          if command -v cc >/dev/null \
            && command -v c++ >/dev/null \
            && command -v make >/dev/null; then
            echo "native build tools are already installed"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential
      - run: cargo clippy -p notary-api -p notary-server-platform-adapter --all-targets --all-features -- -D warnings
      - run: cargo clippy --manifest-path runtime/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - run: cargo test -p notary-api -p notary-server-platform-adapter --all-targets --all-features
      - run: cargo test --manifest-path runtime/Cargo.toml --workspace --all-targets --all-features

  postgres-integration:
    name: PostgreSQL integration
    needs: [changes, rust]
    if: ${{ always() && needs.changes.outputs.rust == 'true' && needs.rust.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Confirm Docker is available
        run: docker info
      - name: Run PostgreSQL-backed API tests
        # The skipped live-bucket test is the sole ignored platform test that
        # is not backed by a disposable PostgreSQL container.
        run: >-
          cargo test -p notary-api -- --ignored
          --skip live_s3_presigned_upload_and_promotion_round_trip
          --test-threads=4
      - name: Run PostgreSQL-backed daemon metadata tests
        run: cargo test --manifest-path runtime/Cargo.toml -p notaryd postgres_metadata_store::tests -- --ignored --nocapture
      - name: Run S3-compatible daemon artifact tests
        run: cargo test --manifest-path runtime/Cargo.toml -p notaryd s3_artifact_store::tests::minio_conforms_and_detects_missing_corrupt_and_oversized_objects -- --ignored --nocapture
      - name: Run daemon persistence and server matrix
        run: |
          runtime/test-daemon-persistence-e2e.sh sqlite filesystem 1 full
          DAEMON_E2E_SKIP_BUILD=1 runtime/test-daemon-persistence-e2e.sh sqlite s3 1 full
          DAEMON_E2E_SKIP_BUILD=1 runtime/test-daemon-persistence-e2e.sh postgres s3 2 full

  windows-update:
    name: Windows client update
    needs: changes
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.windows_update == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: client-update-windows
      - name: Test Windows-specific client workflows
        run: |
          cargo test --locked --manifest-path runtime/Cargo.toml -p notary-updater --lib
          cargo test --locked --manifest-path runtime/Cargo.toml -p notaryctl skill_install --lib
          cargo test --locked --manifest-path runtime/Cargo.toml -p notaryd artifact_store::tests --lib
          cargo test --locked --manifest-path runtime/Cargo.toml -p notaryd artifact_router::tests --lib
          cargo test --locked --manifest-path runtime/Cargo.toml -p notaryd s3_artifact_store::tests --lib

  app:
    name: SPA
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: platform/web
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/web/package-lock.json
      - run: npm ci
      - run: node ../../scripts/release-manifest.test.mjs
      - run: npm run build
      - run: npm --prefix ../../runtime/apps/admin-dashboard ci
      - run: npm --prefix ../../runtime/apps/admin-dashboard run build
      - name: Verify generated APIs and embedded dashboard are committed
        run: git -C ../.. diff --exit-code -- platform/web/src/platform-api/generated runtime/apps/admin-dashboard/src/generated runtime/crates/notaryd/dashboard
      - name: Install browser test runtime
        run: npx --prefix ../../runtime/apps/admin-dashboard playwright install --with-deps chromium
      - run: npm --prefix ../../runtime/apps/admin-dashboard run test
      - run: npm run test:site
      - run: npm run test:install

  desktop:
    name: macOS desktop bundle
    needs: changes
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.desktop == 'true'
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/notary-app
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/notary-app/package-lock.json
      - run: npm ci
      - name: Prepare bundled daemon
        run: npm run prepare:sidecar:debug
      - run: cargo clippy -p notary-app --all-targets -- -D warnings
      - name: Build debug application bundle with bundled daemon
        run: npm exec -- tauri build --debug --bundles app
      - name: Verify signed updater artifact packaging
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/updater.key"
          npm exec -- tauri signer generate --ci --password test-password --write-keys "$key" >/dev/null
          NOTARY_BUILD_ID=ci-updater-fixture \
            TAURI_SIGNING_PRIVATE_KEY="$key" \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD=test-password \
            npm exec -- tauri build --debug --bundles app \
              --config src-tauri/tauri.release.conf.json --ci
          updater=$(find ../../target/debug/bundle/macos -maxdepth 1 -name '*.app.tar.gz' -print -quit)
          test -n "$updater"
          test -s "$updater.sig"

  docs:
    name: Local workflow documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node runtime/apps/admin-dashboard/scripts/check-local-docs.mjs

  containers:
    name: Deployment configuration
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-compose-action@v1
      - name: Validate production container workspace build
        run: docker build --target builder .
      - name: Test Fly image digest resolution
        run: bash deploy/fly/test-resolve-image-digest.sh
      - name: Test notary-api deployment preflight
        run: bash deploy/fly/test-preflight-notary-api.sh
      - name: Test Fly notary-server preflight
        run: bash deploy/fly/test-preflight-notary-server.sh
      - name: Test notary-server secret materialization
        run: |
          set -euo pipefail
          image="notary-server-entrypoint:${GITHUB_SHA}"
          signing_key="$RUNNER_TEMP/notary-server-signing-key"
          service_token="$RUNNER_TEMP/notary-server-service-token"
          openssl rand -hex 32 > "$signing_key"
          openssl rand -hex 32 > "$service_token"
          chmod 0644 "$signing_key" "$service_token"
          docker build --target notary-server --tag "$image" .
          test -n "$(docker run --rm --read-only \
            --tmpfs /run/notary-private:rw,mode=0700 \
            --mount type=bind,src="$signing_key",dst=/run/secrets/notary_signing_key,readonly \
            "$image" public-key)"
          container="$(docker run --detach --read-only \
            --publish 127.0.0.1::7047 \
            --tmpfs /run/notary-private:rw,mode=0700 \
            --tmpfs /data:rw,mode=0700 \
            --tmpfs /tmp:rw \
            --mount type=bind,src="$signing_key",dst=/run/secrets/notary_signing_key,readonly \
            --mount type=bind,src="$service_token",dst=/run/secrets/admission_service_token,readonly \
            --env NOTARY_SERVER_LISTEN=0.0.0.0:7047 \
            --env NOTARY_SERVER_ALLOW_HOSTS=api.openai.com \
            --env NOTARY_SERVER_PLATFORM_API_ORIGIN=http://127.0.0.1:9 \
            --env NOTARY_SERVER_REGISTRY_GENERATION=1 \
            --env NOTARY_SERVER_INSTANCE_ID=notary-ci \
            --env NOTARY_SERVER_USAGE_OUTBOX_DIR=/data/usage-outbox \
            "$image" serve)"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          port="$(docker port "$container" 7047/tcp | sed 's/.*://')"
          for _ in $(seq 1 30); do
            if timeout 1 bash -c "</dev/tcp/127.0.0.1/$port" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          timeout 1 bash -c "</dev/tcp/127.0.0.1/$port"
          docker exec "$container" sh -eu -c '
            for file in /run/notary-private/notary_signing_key /run/notary-private/admission_service_token; do
              test -f "$file"
              test ! -L "$file"
              test "$(stat -c %a "$file")" = 400
            done
          '
      - name: Validate Compose configuration
        run: |
          openssl rand -hex 32 > "$RUNNER_TEMP/notary-signing-key"
          openssl rand -hex 32 > "$RUNNER_TEMP/admission-service-token"
          openssl rand -hex 32 > "$RUNNER_TEMP/anonymous-subject-hmac-key"
          printf '%s\n' '{}' > "$RUNNER_TEMP/notary-registry.json"
          printf '%s\n' 'google-ci-secret' > "$RUNNER_TEMP/google-oauth-secret"
          printf '%s\n' 'github-ci-secret' > "$RUNNER_TEMP/github-oauth-secret"
          NOTARY_SERVER_SIGNING_KEY_SOURCE_FILE="$RUNNER_TEMP/notary-signing-key" \
            NOTARY_ADMISSION_SERVICE_TOKEN_SOURCE_FILE="$RUNNER_TEMP/admission-service-token" \
            NOTARY_API_ADMISSION_ANONYMOUS_SUBJECT_HMAC_KEY_FILE="$RUNNER_TEMP/anonymous-subject-hmac-key" \
            NOTARY_API_REGISTRY_FILE="$RUNNER_TEMP/notary-registry.json" \
            NOTARY_API_GOOGLE_CLIENT_SECRET_FILE="$RUNNER_TEMP/google-oauth-secret" \
            NOTARY_API_GITHUB_CLIENT_SECRET_FILE="$RUNNER_TEMP/github-oauth-secret" \
            NOTARY_SERVER_PUBLIC_KEY=0279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798 \
            CLOUDFLARE_TUNNEL_TOKEN=ci-placeholder \
            NOTARY_API_GITHUB_CLIENT_ID=ci-placeholder \
            NOTARY_API_GOOGLE_CLIENT_ID=ci-placeholder \
            NOTARY_API_DATABASE_URL=postgresql://ci-placeholder:ci-placeholder@db.example.com/notary_api?sslmode=require \
            NOTARY_API_MIGRATION_DATABASE_URL=postgresql://ci-placeholder:ci-placeholder@db.example.com/notary_api?sslmode=require \
            NOTARY_API_S3_ACCESS_KEY_ID=ci-placeholder \
            NOTARY_API_S3_SECRET_ACCESS_KEY=ci-placeholder \
            NOTARY_API_S3_BUCKET=notary-api-ci \
            NOTARY_API_S3_ENDPOINT=https://sfo3.digitaloceanspaces.com \
            NOTARY_API_S3_REGION=sfo3 \
            NOTARY_PUBLIC_ORIGIN=https://example.com \
            docker compose config --quiet
      - name: Validate standalone daemon cluster bundle
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/notary-cluster"
          NOTARYD_CLUSTER_STATE_DIR="$state" \
            runtime/notary-cluster.sh init \
              proxy.example.com admin.example.com \
              tls://notary.example.com:7047 \
              0279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798 \
              >/dev/null
          rendered=$(docker compose --env-file "$state/.env" -f runtime/compose.cluster.yml config --format json)
          jq -e '
            .services.daemon.deploy.mode == "replicated" and
            .services.daemon.deploy.replicas == 2 and
            (.services.daemon.expose | sort) == ["8787", "8788"] and
            (.services | has("daemon-a") | not) and
            (.services | has("daemon-b") | not) and
            (.services | has("ingress") | not)
          ' <<<"$rendered" >/dev/null
          test "$(wc -c < "$state/secrets/cluster-vault.key")" -eq 32
          test ! -e "$state/secrets/vault-passphrase"
          # The initializer writes database, object-store, and dashboard
          # credentials into its default state directory, so that directory
          # must stay ignored by the repository that contains it.
          default_state="$(sed -n \
            's|.*NOTARYD_CLUSTER_STATE_DIR:-"$runtime_dir/\([^"]*\)".*|\1|p' \
            runtime/notary-cluster.sh)"
          test -n "$default_state"
          git check-ignore --quiet "runtime/$default_state/secrets/admin-password"
          if NOTARYD_CLUSTER_STATE_DIR="$state" \
            runtime/notary-cluster.sh init \
              proxy.example.com admin.example.com \
              tls://notary.example.com:7047 \
              0279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798 \
              >/dev/null 2>&1; then
            echo "cluster initializer overwrote existing state" >&2
            exit 1
          fi

  required:
    name: Required checks
    if: always()
    needs: [changes, rust, postgres-integration, windows-update, app, desktop, docs, containers]
    runs-on: ubuntu-24.04
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      RUST_CHANGED: ${{ needs.changes.outputs.rust }}
      RUST_RESULT: ${{ needs.rust.result }}
      POSTGRES_RESULT: ${{ needs.postgres-integration.result }}
      WINDOWS_UPDATE_REQUIRED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.windows_update == 'true' }}
      WINDOWS_UPDATE_RESULT: ${{ needs.windows-update.result }}
      APP_CHANGED: ${{ needs.changes.outputs.app }}
      APP_RESULT: ${{ needs.app.result }}
      DESKTOP_REQUIRED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.desktop == 'true' }}
      DESKTOP_RESULT: ${{ needs.desktop.result }}
      DOCS_CHANGED: ${{ needs.changes.outputs.docs }}
      DOCS_RESULT: ${{ needs.docs.result }}
      CONTAINERS_CHANGED: ${{ needs.changes.outputs.containers }}
      CONTAINERS_RESULT: ${{ needs.containers.result }}
    steps:
      - name: Require every selected check to pass
        run: |
          set -euo pipefail

          if test "$CHANGES_RESULT" != success; then
            echo "changed-path selection ended with: $CHANGES_RESULT" >&2
            exit 1
          fi

          require_selected() {
            local name="$1"
            local selected="$2"
            local result="$3"
            if test "$selected" = true && test "$result" != success; then
              echo "$name was selected but ended with: $result" >&2
              exit 1
            fi
            case "$result" in
              success|skipped) ;;
              *) echo "$name ended with: $result" >&2; exit 1 ;;
            esac
          }

          require_selected Rust "$RUST_CHANGED" "$RUST_RESULT"
          require_selected PostgreSQL "$RUST_CHANGED" "$POSTGRES_RESULT"
          require_selected "Windows client update" "$WINDOWS_UPDATE_REQUIRED" "$WINDOWS_UPDATE_RESULT"
          require_selected SPA "$APP_CHANGED" "$APP_RESULT"
          require_selected Desktop "$DESKTOP_REQUIRED" "$DESKTOP_RESULT"
          require_selected Documentation "$DOCS_CHANGED" "$DOCS_RESULT"
          require_selected Deployment "$CONTAINERS_CHANGED" "$CONTAINERS_RESULT"

  deploy:
    name: Production deployment
    needs: [changes, required]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.containers == 'true' &&
      needs.required.result == 'success'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  publish-cli:
    name: Publish website CLI
    needs: [changes, required, deploy]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.cli == 'true' &&
      needs.required.result == 'success' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    uses: ./.github/workflows/release.yml
    with:
      channel: latest
    secrets: inherit
