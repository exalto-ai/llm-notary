name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digitalocean-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      NOTARY_IMAGE: ttl.sh/llm-notary-notary-${{ github.run_id }}-${{ github.run_attempt }}:24h
      WEB_IMAGE: ttl.sh/llm-notary-web-${{ github.run_id }}-${{ github.run_attempt }}:24h
      API_IMAGE: ttl.sh/llm-notary-api-${{ github.run_id }}-${{ github.run_attempt }}:24h
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build and publish notary image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: notary
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.NOTARY_IMAGE }}
          cache-from: type=gha,scope=rust-service-images
          cache-to: type=gha,mode=max,scope=rust-service-images
      - name: Build and publish web image
        uses: docker/build-push-action@v7
        with:
          context: ./js/app
          file: ./js/app/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.WEB_IMAGE }}
          cache-from: type=gha,scope=web-image
          cache-to: type=gha,mode=max,scope=web-image
      - name: Build and publish API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: api
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha,scope=rust-service-images
          cache-to: type=gha,mode=max,scope=rust-service-images
      - name: Upload Compose definition
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DO_SSH_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DO_SSH_PORT || 22 }}
          source: compose.yml
          target: /opt/llm-notary
          overwrite: true
      - name: Pull images and restart services
        uses: appleboy/ssh-action@v1.2.4
        env:
          NOTARY_IMAGE: ${{ env.NOTARY_IMAGE }}
          WEB_IMAGE: ${{ env.WEB_IMAGE }}
          API_IMAGE: ${{ env.API_IMAGE }}
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.LLM_NOTARY_GITHUB_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.LLM_NOTARY_GITHUB_OAUTH_CLIENT_SECRET }}
          LLM_NOTARY_NOTARY_HOST: ${{ secrets.DO_SSH_HOST }}
        with:
          host: ${{ secrets.DO_SSH_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DO_SSH_PORT || 22 }}
          envs: NOTARY_IMAGE,WEB_IMAGE,API_IMAGE,SITE_DOMAIN,CLOUDFLARE_TUNNEL_TOKEN,GITHUB_OAUTH_CLIENT_ID,GITHUB_OAUTH_CLIENT_SECRET,LLM_NOTARY_NOTARY_HOST
          script: |
            set -eu
            test -n "$SITE_DOMAIN"
            test -n "$CLOUDFLARE_TUNNEL_TOKEN"
            test -n "$GITHUB_OAUTH_CLIENT_ID"
            test -n "$GITHUB_OAUTH_CLIENT_SECRET"
            test -n "$LLM_NOTARY_NOTARY_HOST"
            test -r /opt/llm-notary/notary-signing-key
            cd /opt/llm-notary
            cat > deploy.env <<EOF
            NOTARY_IMAGE=$NOTARY_IMAGE
            WEB_IMAGE=$WEB_IMAGE
            API_IMAGE=$API_IMAGE
            NOTARY_SIGNING_KEY_FILE=/opt/llm-notary/notary-signing-key
            SITE_DOMAIN=$SITE_DOMAIN
            LLM_NOTARY_NOTARY_HOST=$LLM_NOTARY_NOTARY_HOST
            CLOUDFLARE_TUNNEL_TOKEN=$CLOUDFLARE_TUNNEL_TOKEN
            GITHUB_OAUTH_CLIENT_ID=$GITHUB_OAUTH_CLIENT_ID
            GITHUB_OAUTH_CLIENT_SECRET=$GITHUB_OAUTH_CLIENT_SECRET
            EOF
            chmod 600 deploy.env
            docker compose --env-file deploy.env pull
            docker compose --env-file deploy.env up -d --remove-orphans
            docker compose --env-file deploy.env ps
