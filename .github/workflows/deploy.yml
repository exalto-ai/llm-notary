name: Deploy to Fly.io

on:
  # Production has one entry point: the gated job in ci.yml. Keeping this as a
  # reusable workflow prevents a second push trigger from racing the CI run.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: fly-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    env:
      IMAGE_LABEL: ci-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      NOTARY_IMAGE_TAG: registry.fly.io/llm-notary-prod-notary:ci-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      API_IMAGE_TAG: registry.fly.io/llm-notary-prod-api:ci-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      WEB_IMAGE_TAG: registry.fly.io/llm-notary-prod-web:ci-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      # superfly/flyctl-actions 1.6
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      # Build every image before changing any Machine. A build failure is then
      # a no-op in production, and each deploy below uses the resolved digest.
      - name: Build notary image on Fly
        id: notary-image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_NOTARY_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          flyctl deploy --remote-only --build-only --push \
            --image-label "$IMAGE_LABEL" --config deploy/fly/notary.fly.toml
          flyctl auth docker
          digest="$(bash deploy/fly/resolve-image-digest.sh "$NOTARY_IMAGE_TAG")"
          echo "ref=${NOTARY_IMAGE_TAG%:*}@$digest" >> "$GITHUB_OUTPUT"
      - name: Build API image on Fly
        id: api-image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          flyctl deploy --remote-only --build-only --push \
            --image-label "$IMAGE_LABEL" --config deploy/fly/api.fly.toml
          flyctl auth docker
          digest="$(bash deploy/fly/resolve-image-digest.sh "$API_IMAGE_TAG")"
          echo "ref=${API_IMAGE_TAG%:*}@$digest" >> "$GITHUB_OUTPUT"
      - name: Build web image on Fly
        id: web-image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_WEB_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          flyctl deploy js/app --remote-only --build-only --push \
            --image-label "$IMAGE_LABEL" \
            --config "$GITHUB_WORKSPACE/deploy/fly/web.fly.toml"
          flyctl auth docker
          digest="$(bash deploy/fly/resolve-image-digest.sh "$WEB_IMAGE_TAG")"
          echo "ref=${WEB_IMAGE_TAG%:*}@$digest" >> "$GITHUB_OUTPUT"

      - name: Record rollback images
        id: previous
        env:
          NOTARY_TOKEN: ${{ secrets.FLY_NOTARY_DEPLOY_TOKEN }}
          API_TOKEN: ${{ secrets.FLY_API_DEPLOY_TOKEN }}
          WEB_TOKEN: ${{ secrets.FLY_WEB_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail

          current_image() {
            local app="$1"
            local token="$2"
            FLY_API_TOKEN="$token" flyctl machines list --json --app "$app" |
              jq -er '
                [
                  .[]?.image_ref |
                  "\(.registry)/\(.repository)@\(.digest)"
                ] | unique |
                if length == 1 then .[0]
                else error("expected exactly one current image for the app")
                end |
                if test("@sha256:[0-9a-f]{64}$") then .
                else error("current image is not digest-pinned")
                end
              '
          }

          {
            echo "notary=$(current_image llm-notary-prod-notary "$NOTARY_TOKEN")"
            echo "api=$(current_image llm-notary-prod-api "$API_TOKEN")"
            echo "web=$(current_image llm-notary-prod-web "$WEB_TOKEN")"
          } >> "$GITHUB_OUTPUT"

      # Deploy the admission API before the notary that calls it. The new API
      # remains compatible with the existing gateway and notary; the new
      # notary intentionally requires v3 admission tickets.
      - name: Deploy API image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_DEPLOY_TOKEN }}
          API_IMAGE: ${{ steps.api-image.outputs.ref }}
        run: |
          touch "$RUNNER_TEMP/api-rollout-attempted"
          flyctl deploy --image "$API_IMAGE" --ha=true --strategy rolling \
            --config deploy/fly/api.fly.toml
      - name: Verify old web to new API compatibility
        run: >-
          curl --fail --retry 5 --retry-all-errors --retry-delay 2
          --max-time 20 https://llm-notary.exalto.ai/api/readyz
      - name: Deploy notary image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_NOTARY_DEPLOY_TOKEN }}
          NOTARY_IMAGE: ${{ steps.notary-image.outputs.ref }}
        run: |
          touch "$RUNNER_TEMP/notary-rollout-attempted"
          flyctl deploy --image "$NOTARY_IMAGE" --ha=false --strategy rolling \
            --config deploy/fly/notary.fly.toml
      # Deliberately present a capture ticket as a finalization. The notary
      # must reach the authenticated coordinator and return admission_denied,
      # but it must not acquire a lease or consume production capacity.
      - name: Verify v3 TLS notary admission control
        run: |
          python3 - <<'PY'
          import json
          import socket
          import ssl
          import time
          import urllib.error
          import urllib.request

          api_url = "https://llm-notary.exalto.ai/api/notary/admissions"
          hostname = "llm-notary-prod-notary.fly.dev"
          target = (hostname, 443)
          last_error = None
          for _ in range(5):
              try:
                  request = urllib.request.Request(
                      api_url,
                      data=json.dumps({"mode": "capture"}).encode(),
                      headers={"Content-Type": "application/json"},
                      method="POST",
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      admission = json.load(response)
                  ticket = admission.get("ticket")
                  if not isinstance(ticket, str) or not 0 < len(ticket.encode()) <= 512:
                      raise RuntimeError("admission API returned an invalid ticket")

                  encoded_ticket = ticket.encode()
                  prelude = (
                      b"LLMN\x00\x00\x00\x03\x03"
                      + len(encoded_ticket).to_bytes(2, "big")
                      + encoded_ticket
                  )
                  with socket.create_connection(target, timeout=15) as connection:
                      with ssl.create_default_context().wrap_socket(
                          connection, server_hostname=hostname
                      ) as tls_connection:
                          tls_connection.settimeout(15)
                          tls_connection.sendall(prelude)
                          response = b""
                          while len(response) < 6:
                              chunk = tls_connection.recv(6 - len(response))
                              if not chunk:
                                  raise RuntimeError("notary closed the admission response")
                              response += chunk
                          if response[:2] != b"\x02\x04":
                              raise RuntimeError(
                                  "notary did not return the expected admission denial"
                              )
                  break
              except (OSError, ValueError, RuntimeError, urllib.error.URLError) as error:
                  last_error = error
                  time.sleep(3)
          else:
              raise last_error or RuntimeError("notary did not become ready")
          PY
      - name: Deploy web gateway image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_WEB_DEPLOY_TOKEN }}
          WEB_IMAGE: ${{ steps.web-image.outputs.ref }}
        run: |
          touch "$RUNNER_TEMP/web-rollout-attempted"
          flyctl deploy js/app --image "$WEB_IMAGE" --ha=false --strategy rolling \
            --config "$GITHUB_WORKSPACE/deploy/fly/web.fly.toml"
      - name: Verify new web to API wake-up
        run: >-
          curl --fail --retry 5 --retry-all-errors --retry-delay 2
          --max-time 20 https://llm-notary.exalto.ai/api/readyz

      - name: Restore previous images after a failed rollout
        if: ${{ failure() && steps.previous.outcome == 'success' }}
        env:
          PREVIOUS_NOTARY_IMAGE: ${{ steps.previous.outputs.notary }}
          PREVIOUS_API_IMAGE: ${{ steps.previous.outputs.api }}
          PREVIOUS_WEB_IMAGE: ${{ steps.previous.outputs.web }}
          NOTARY_TOKEN: ${{ secrets.FLY_NOTARY_DEPLOY_TOKEN }}
          API_TOKEN: ${{ secrets.FLY_API_DEPLOY_TOKEN }}
          WEB_TOKEN: ${{ secrets.FLY_WEB_DEPLOY_TOKEN }}
        run: |
          set +e
          rollback_failed=0

          if test -e "$RUNNER_TEMP/web-rollout-attempted"; then
            FLY_API_TOKEN="$WEB_TOKEN" flyctl deploy js/app \
              --image "$PREVIOUS_WEB_IMAGE" --ha=false --strategy rolling \
              --skip-release-command \
              --config "$GITHUB_WORKSPACE/deploy/fly/web.fly.toml" || rollback_failed=1
          fi

          if test -e "$RUNNER_TEMP/api-rollout-attempted"; then
            FLY_API_TOKEN="$API_TOKEN" flyctl deploy \
              --image "$PREVIOUS_API_IMAGE" --ha=true --strategy rolling \
              --skip-release-command --config deploy/fly/api.fly.toml || rollback_failed=1
          fi

          if test -e "$RUNNER_TEMP/notary-rollout-attempted"; then
            FLY_API_TOKEN="$NOTARY_TOKEN" flyctl deploy \
              --image "$PREVIOUS_NOTARY_IMAGE" --ha=false --strategy rolling \
              --skip-release-command --config deploy/fly/notary.fly.toml || rollback_failed=1
          fi

          exit "$rollback_failed"
