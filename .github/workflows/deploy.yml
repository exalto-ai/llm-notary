name: Deploy to Fly.io

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v6
      # superfly/flyctl-actions 1.6
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Deploy notary
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_NOTARY_DEPLOY_TOKEN }}
        run: flyctl deploy --remote-only --ha=false --config deploy/fly/notary.fly.toml
      - name: Deploy API
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_DEPLOY_TOKEN }}
        run: flyctl deploy --remote-only --ha=false --config deploy/fly/api.fly.toml
      - name: Deploy web gateway
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_WEB_DEPLOY_TOKEN }}
        run: >-
          flyctl deploy js/app --remote-only --ha=false
          --config "$GITHUB_WORKSPACE/deploy/fly/web.fly.toml"
      - name: Verify web to API wake-up
        run: >-
          curl --fail --retry 5 --retry-all-errors --retry-delay 2
          --max-time 20 https://llm-notary-prod-web.fly.dev/api/healthz
      - name: Verify raw TCP notary admission
        run: |
          python3 - <<'PY'
          import socket
          import time

          target = ("llm-notary-prod-notary.fly.dev", 7047)
          prelude = b"LLMN\x00\x00\x00\x02\x02"
          last_error = None
          for _ in range(5):
              try:
                  with socket.create_connection(target, timeout=15) as connection:
                      connection.settimeout(15)
                      connection.sendall(prelude)
                      if connection.recv(1) != b"\x01":
                          raise RuntimeError("notary did not admit the control prelude")
                  break
              except OSError as error:
                  last_error = error
                  time.sleep(3)
          else:
              raise last_error or RuntimeError("notary did not become ready")
          PY
